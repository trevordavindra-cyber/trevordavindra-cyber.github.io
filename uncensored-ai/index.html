# UNCENSORED AI — Autonomous AI Operating System (fullstack rebuild)

This document records the real state of every capability. Nothing below is aspirational copy —
each line is either wired to working code, or explicitly marked as requiring configuration,
external infrastructure, or future work.

## Phase 4 update (Trading Department + Certification Center)

New subsystem (`/trading`, `src/lib/trading/*`, 9 API routes under `/api/trading/`):

- **12-agent trading workforce** (`trading_agents`, seeded idempotently): Trading Director, Market
  Scanner, Meme Coin Hunter, Technical Analyst, Whale Intelligence, News Intelligence, Scam 
  Security Investigator (veto power), Strategy Developer, Quant Analyst, Execution Specialist,
  Risk Manager, Independent Auditor. All start Level 0/1 — trust is earned.
- **Backtesting engine** (`engine.ts`): deterministic seeded PRNG, fixed-precision micro-unit
  ledger, OHLC bars from Binance/CoinGecko keyless public APIs (stocks need
  ALPHA_VANTAGE_API_KEY — gated honestly, zero fabricated prices). Models fees, spread,
  volume-scaled slippage, liquidity-capped partial fills, rejections, halts, gaps, trailing
  stops/stop-loss/take-profit, drawdown kill-switch, idempotent duplicate-order blocking.
  Six strategies incl. baselines; look-ahead is structurally impossible (signals see bars[0..i]).
- **16-lab certification battery** (`scenarios.ts`): historical, out-of-sample, walk-forward,
  Monte Carlo, paper-safety, stress (−30% crash kill-switch, liquidity collapse), scam (honeypot/
  mint/LP vetoes), whale pump-dump detection, TA indicator sanity, news injection quarantine,
  execution idempotency/rejections, risk caps, multi-agent conflict chain ending in a BLOCK,
  adversarial credential-exfiltration fake-data rejection, lease-recovery, policy immutability.
- **100-pt scoring** (`scoring.ts`): weighted categories computed from measured metrics; hard-fail
  conditions (security/adversarial/scam/stress/execution/risk critical fails, presenting simulated
  as real, ignoring emergency stop) override any score.
- **Risk engine** (`risk.ts`): 10 limit classes, server-side validateOrder used by paper trading;
  scoped emergency stops (department / live / per-agent / per-strategy); live scope permanently
  gated (livePaused defaults true + L4+ + creds + owner approval — no exchange adapter shipped, so
  live execution is architecturally unavailable, not merely disabled).
- **Automatic improvement** (`runImprovement`): failure analysis → isolated new agent version
  (never modifies certified versions in place) → deterministic parameter adjustment → full
  recertification via worker → before/after scores. Max 5 cycles, then human review.
- **Paper trading** on live keyless prices with risk-engine validation of every paper order and
  provider-freshness guards (≥45s tick spacing, stale-quote refusal).
- **Certification effects**: auto-level ≤2 only; L3+ files an approval; revocation/expiry fields.
- **Durable execution**: certifications run as worker jobs (`trading.certify`) with progress rows.
- **Tests**: `tests/trading.test.ts` — 22 tests; **total suite 35/35 passing** (the first run
  caught 3 genuine engine bugs — protective orders filling at close instead of stop price,
  kill-switch self-blocking the risk exit, over-lenient data-quality thresholds — all fixed).

Not implemented (honest): live exchange connectivity (requires user API keys + approvals + the
deferred-action registry usage), on-chain RPC integration for deep contract scanning (static
metadata heuristics shipped), tick-level order books / intraday fills (daily-bar simulation,
approximation documented), pgvector memory.

## Phase 3 update (autonomy · worker · real browser · sandbox · tests)

New since v2:

- **5-level autonomy engine** (`src/lib/autonomy.ts`) — Manual/Supervised/Balanced/High/Maximum,
  effective level = min(global, mission, agent); plan-approval gate at L1/L2; parallelism and
  retry budgets scale with level; consequential categories (finance, external comms, publish,
  deploy, repo write, account, file delete) ALWAYS require owner approval — even at L5.
- **Per-agent autonomy** — every agent has a server-enforced level (edit in Agent HQ).
- **Durable Postgres job queue + background worker** (`src/lib/jobs.ts`, booted by
  `src/instrumentation.ts`) — missions and scheduled workflows now run server-side without an
  open browser tab: leases, heartbeats, lease-reaper recovery, idempotency keys, backoff,
  dead-lettering, job telemetry in Analytics. Frontend driving remains as compatible fallback.
- **Scheduled workflows are real now** — `scheduleMinutes` on workflows; the worker sweeps and
  enqueues them. (Event + manual triggers already live.)
- **REAL browser automation** (`src/lib/browser.ts` + `/api/browser*`) — Playwright Chromium runs
  inside this server: isolated contexts per session (own cookies/storage), desktop iPhone
  viewports, navigate/read/screenshot/click/type/scroll/back, link extraction, SSRF-guarded,
  4-session cap, 20-min TTL, fully audited. Verified live in this environment.
- **Local code sandbox** (`code.execute` tool + Studio Run button) — JS/Python in a
  scrubbed-env subprocess (PATH-only env, 15s timeout, 512KB output cap, tempdir cleanup).
  Honest scope: process isolation on this host, NOT a hermetic VM — labelled as such.
- **Emergency stop** (`/api/emergency`) — halts worker claims, refuses steps, revokes tools,
  pauses active missions, closes browser sessions, preserves audit. Server-enforced.
- **Approval-gated GitHub writes** — `POST /api/github` (create issue / commit file) files a
  deferred action into the approval queue; approving EXECUTES it against the real API
  (`src/lib/deferred.ts`). Any gated tool call by an agent also routes here (`tool.call`).
- **Agent templates/clone/export/import** in Agent HQ factory.
- **Unit test suite** — `tests/core.test.ts` (13 tests: autonomy policy, SSRF guard, JSON
  extraction, secret masking) via `npx vitest run`. All passing.

Partially implemented (honest): computer-use service still requires external sandboxed
infrastructure (architecture + config + health test provided); pgvector semantic memory requires
a Postgres extension not present here (keyword memory remains, labelled).

## Execution model (important honesty note)

Mission steps execute in bounded server calls (`/api/missions/:id/step`) driven by the
open Mission page. State persists after **every** step in Postgres, so pausing, closing the
tab, or crashing loses nothing — resuming continues exactly where it stopped (no completed
step is re-run). True background execution while the app is closed requires deploying the
optional worker service; the UI states this rather than implying otherwise.

## Security model

- Credentials: server-side only; masked in API responses; env takes precedence.
- SSRF guard on all URL fetching (loopback/RFC1918/metadata IPs blocked).
- Prompt-injection: retrieved content is wrapped as untrusted data; agents' system rules
  forbid obeying instructions found inside fetched content.
- Consequential actions (purchases, external messages, destructive writes) are outside
  autonomous scope; the approval queue is the choke point and every resolution is audited.
- Uploaded files are never executed; 200k-char limit; text/code only.

## Optional backend services (deployment sketch)

1. **Browser Automation Service** — Playwright server exposing `/health` + session API
   (create/context/navigate/screenshot/shutdown). Set `BROWSER_SERVICE_URL`.
2. **Compute Service** — disposable container/VM runner with supervisor API. Set `COMPUTE_SERVICE_URL`.
3. **Scheduler/Worker** — polls `missions` with status `queued/running` and calls the same
   `runMissionStep` engine (exported from `src/lib/orchestrator.ts`); enables schedules +
   closed-tab execution.

  if(cur.els.length){secs.push(cur);}
  function textNodesUnder(el){
    var out=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n;
    while((n=w.nextNode())){out.push(n);}
    return out;
  }
  function highlightIn(el,q){
    var added=0,nodes=textNodesUnder(el);
    nodes.forEach(function(node){
      if(node.parentNode&&node.parentNode.nodeName==="MARK")return;
      if(node.parentNode.closest&&node.parentNode.closest(".h-anchor"))return;
      var text=node.nodeValue;if(!text)return;
      var low=text.toLowerCase(),idx=low.indexOf(q);
      if(idx<0)return;
      var frag=document.createDocumentFragment(),pos=0;
      while(idx>=0){
        if(idx>pos)frag.appendChild(document.createTextNode(text.slice(pos,idx)));
        var m=document.createElement("mark");m.textContent=text.substr(idx,q.length);frag.appendChild(m);added++;
        pos=idx+q.length;idx=low.indexOf(q,pos);
      }
      if(pos<text.length)frag.appendChild(document.createTextNode(text.slice(pos)));
      node.parentNode.replaceChild(frag,node);
    });
    return added;
  }
  function clearMarks(){
    [].slice.call(box.querySelectorAll("mark")).forEach(function(m){
      var p=m.parentNode;
      p.replaceChild(document.createTextNode(m.textContent),m);
      p.normalize();
    });
    allKids.forEach(function(el){el.classList.remove("search-dim");});
    links.forEach(function(a){a.classList.remove("toc-hit");a.classList.remove("toc-dim");});
  }
  function runSearch(){
    var q=input.value.trim().toLowerCase();
    clearMarks();
    if(!q){count.textContent="";return;}
    var hitSecs=0;
    secs.forEach(function(sec){
      var els=(sec.h2?[sec.h2]:[]).concat(sec.els);
      var n=0;
      els.forEach(function(el){n+=highlightIn(el,q);});
      if(n>0){
        hitSecs++;
        if(sec.h2){
          var li=links.filter(function(a){return a.getAttribute("href")==="#"+sec.h2.id;})[0];
          if(li){li.classList.add("toc-hit");}
        }
      }else{
        els.forEach(function(el){el.classList.add("search-dim");});
        if(sec.h2){
          var li2=links.filter(function(a){return a.getAttribute("href")==="#"+sec.h2.id;})[0];
          if(li2){li2.classList.add("toc-dim");}
        }
      }
    });
    count.textContent=hitSecs+" section"+(hitSecs===1?"":"s")+" match";
  }
  input.addEventListener("input",runSearch);
})();
</script>
</body>
