      <button id="modebtn" class="modebtn" title="Switch mode">ROBLOX</button>

    </div>

  <main id="chat"></main>
  <div id="cooldown" class="hidden"><span id="cdmsg"></span></div>
  <footer id="composer">

    <button id="send" title="Send">➤</button>
  </footer>
</div>
