<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FRIDAY — Trevor's Personal AI</title>
<style>:root{--cy:#00e5ff;--rd:#ff2d55;--grn:#22ff9a;--pk:#ff4fd8}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:#04060b;color:#d7f6ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(65% 40% at 50% 0%,rgba(255,45,85,.16),transparent 70%),radial-gradient(55% 38% at 50% 100%,rgba(0,229,255,.14),transparent 70%)}#bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);background-size:42px 42px;animation:pan 22s linear infinite}@keyframes pan{to{background-position:42px 42px,42px 42px}}.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:880px;margin:0 auto;padding:8px 12px 0}header{display:flex;align-items:center;gap:12px;padding:4px 2px 8px}.orb{width:46px;height:46px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 32%,#9ff7ff,#00c2e0 42%,#0a3b4d 78%);box-shadow:0 0 16px rgba(0,229,255,.55),inset 0 0 10px rgba(255,255,255,.35);animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 30px rgba(0,229,255,.85),inset 0 0 12px rgba(255,255,255,.45)}}.tmeta{flex:1;min-width:0}h1{font-size:15px;letter-spacing:.4em;color:#eafcff;text-shadow:0 0 12px rgba(0,229,255,.6)}.sub{font-size:9px;color:#7fb6c9;letter-spacing:.22em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tclock{text-align:right}#clock{font-size:14px;color:var(--cy);text-shadow:0 0 10px rgba(0,229,255,.5)}#cdate{font-size:8.5px;color:#7fb6c9;letter-spacing:.18em;margin-top:2px}#statusbar{display:flex;gap:10px;align-items:center;font-size:8.5px;letter-spacing:.16em;color:#7fb6c9;border-top:1px solid rgba(0,229,255,.18);border-bottom:1px solid rgba(0,229,255,.18);padding:5px 2px}.dot{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 7px var(--grn);flex:none}#stat{color:#9fe8ff}#cooldown{color:#ff9db0}#chat{flex:1;overflow-y:auto;padding:10px 2px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:rgba(0,229,255,.3) transparent}.msg{max-width:88%;padding:9px 12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;border-radius:11px}.msg.user{align-self:flex-end;background:rgba(0,229,255,.10);border:1px solid rgba(0,229,255,.42);color:#ecffff}.msg.ai{align-self:flex-start;background:rgba(9,13,22,.85);border:1px solid rgba(0,229,255,.24)}.tag{display:block;font-size:7.5px;letter-spacing:.24em;color:#6fa7bb;margin-bottom:4px}.msg img{max-width:min(300px,78vw);border-radius:9px;display:block;margin-top:6px;border:1px solid rgba(0,229,255,.35)}.tools{display:flex;gap:5px;flex-wrap:wrap;padding:6px 0 2px}.chip{font-size:8.5px;letter-spacing:.12em;padding:5px 8px;border:1px solid rgba(0,229,255,.38);border-radius:999px;color:#9fe8ff;background:rgba(0,229,255,.06);cursor:pointer;user-select:none}.chip:active{background:rgba(0,229,255,.22)}.chip.on{background:rgba(0,229,255,.25);color:#fff;border-color:var(--cy)}#composer{display:flex;gap:8px;align-items:flex-end;padding:6px 0 calc(10px + env(safe-area-inset-bottom))}#inp{flex:1;background:rgba(6,10,18,.92);border:1px solid rgba(0,229,255,.4);border-radius:13px;color:#ecffff;font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px 12px;outline:none;resize:none;max-height:120px}#inp:focus{border-color:var(--cy);box-shadow:0 0 12px rgba(0,229,255,.25)}#mic,#send{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(0,229,255,.45);background:rgba(0,229,255,.08);color:var(--cy);font-size:17px;cursor:pointer}#mic.rec{background:rgba(255,45,85,.25);border-color:var(--rd);color:#ffd9e1}#send{background:linear-gradient(135deg,rgba(255,45,85,.3),rgba(0,229,255,.2));border-color:rgba(255,45,85,.55);color:#ffe2e8}#mempanel{position:fixed;top:0;right:0;bottom:0;width:min(330px,94vw);z-index:6;padding:14px;overflow-y:auto;background:rgba(4,8,14,.97);border-left:1px solid rgba(0,229,255,.4);transform:translateX(105%);transition:transform .25s}#mempanel.open{transform:none}#mempanel h2{font-size:11px;letter-spacing:.3em;color:var(--cy);margin-bottom:10px}.mem{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid rgba(0,229,255,.2);border-radius:8px;margin-bottom:7px;font-size:12px;line-height:1.4}.mem button{flex:none;background:none;border:none;color:var(--rd);font-size:14px;cursor:pointer}#memadd{width:100%;margin-top:6px;background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.4);color:#ecffff;font:12px ui-monospace,monospace;padding:9px;border-radius:8px}#memclose{position:absolute;top:10px;right:12px;background:none;border:none;color:#7fb6c9;font-size:18px;cursor:pointer}.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cy);margin-right:4px;animation:bl 1s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}#particles{position:fixed;inset:0;z-index:0;pointer-events:none}#bg:before{content:"";position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(rgba(0,229,255,0),rgba(0,229,255,.08),rgba(0,229,255,0));animation:scan 7s linear infinite}@keyframes scan{to{top:100%}}.orb{position:relative}.orb:before,.orb:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(0,229,255,.5);animation:spin 9s linear infinite}.orb:after{inset:-13px;border:1px solid rgba(255,79,216,.5);border-width:2px 1px 1px 2px;animation:spin 14s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}.orb.think:before,.orb.think:after{border-color:var(--pk);animation-duration:1.4s}.orb.think{animation:pulse .9s ease-in-out infinite}.orb.speak{box-shadow:0 0 34px rgba(255,79,216,.7),inset 0 0 12px rgba(255,255,255,.5)}#hud{display:flex;gap:6px;padding:6px 2px 2px;overflow-x:auto;scrollbar-width:none}#hud::-webkit-scrollbar{display:none}.gauge{flex:1;min-width:76px;border:1px solid rgba(0,229,255,.28);border-radius:8px;background:rgba(9,13,22,.72);padding:5px 6px;position:relative;flex:none}.gauge:before,.gauge:after{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--cy)}.gauge:before{top:-1px;left:-1px;border-right:none;border-bottom:none}.gauge:after{bottom:-1px;right:-1px;border-left:none;border-top:none}.gauge b{display:block;font-size:7px;letter-spacing:.2em;color:#6fa7bb;font-weight:400}.gauge i{display:block;font-style:normal;font-size:10.5px;color:#eafcff;margin:2px 0 4px;text-shadow:0 0 8px rgba(0,229,255,.45)}.gauge s{display:block;height:4px;border-radius:3px;background:rgba(0,229,255,.12);text-decoration:none;overflow:hidden}.gauge s span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cy),var(--pk));box-shadow:0 0 8px rgba(0,229,255,.55);transition:width .9s ease}.msg{animation:msgin .28s ease}@keyframes msgin{from{opacity:0;transform:translateY(8px)}}.msg.ai{position:relative}.msg.ai:before,.msg.ai:after{content:"";position:absolute;width:9px;height:9px;border:1px solid rgba(255,79,216,.55)}.msg.ai:before{top:-1px;left:-1px;border-right:none;border-bottom:none}.msg.ai:after{bottom:-1px;right:-1px;border-left:none;border-top:none}#statusbar.busy .dot{background:var(--pk);box-shadow:0 0 9px var(--pk)}#statusbar.busy #stat{color:#ffb3ec;text-shadow:0 0 8px rgba(255,79,216,.6)}#boot{position:fixed;inset:0;z-index:30;background:#04060b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s;cursor:pointer}#boot.gone{opacity:0;pointer-events:none}#bootring{width:112px;height:112px;border-radius:50%;position:relative;border:2px solid rgba(0,229,255,.6);box-shadow:0 0 26px rgba(0,229,255,.4),inset 0 0 18px rgba(0,229,255,.25);animation:bpulse 1.6s ease-in-out infinite}@keyframes bpulse{50%{box-shadow:0 0 44px rgba(255,79,216,.55),inset 0 0 22px rgba(0,229,255,.4)}}#bootring:before{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed rgba(255,79,216,.55);animation:spin 3s linear infinite}#bootring:after{content:"";position:absolute;inset:28px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#9ff7ff,#00c2e0 45%,#0a3b4d 80%);box-shadow:0 0 22px rgba(0,229,255,.8)}#bootbar{width:180px;height:5px;border:1px solid rgba(0,229,255,.4);border-radius:4px;overflow:hidden}#bootbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--pk));transition:width .35s}#bootlog{font-size:10px;color:#7fb6c9;letter-spacing:.14em;min-height:84px;text-align:center;white-space:pre-line}#boottap{font-size:8px;color:#4d7686;letter-spacing:.22em}#setpanel{position:fixed;top:0;right:0;bottom:0;width:min(330px,94vw);z-index:7;padding:14px;overflow-y:auto;background:rgba(4,8,14,.97);border-left:1px solid rgba(0,229,255,.4);transform:translateX(105%);transition:transform .25s}#setpanel.open{transform:none}#setpanel h2{font-size:11px;letter-spacing:.3em;color:var(--cy);margin-bottom:12px}#setpanel label{display:block;font-size:7.5px;letter-spacing:.22em;color:#6fa7bb;margin:12px 0 5px}#setname,#setpanel input[type=text]{width:100%;background:rgba(0,229,255,.06);border:1px solid rgba(0,229,255,.4);color:#ecffff;font:12px ui-monospace,monospace;padding:9px;border-radius:8px;outline:none}#setrate{width:100%;appearance:none;height:4px;border-radius:3px;background:rgba(0,229,255,.15);outline:none;margin:6px 0}#setrate::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);cursor:pointer}#themes{display:flex;gap:6px;flex-wrap:wrap}#clearchat{width:100%;margin-top:16px;background:rgba(255,45,85,.12);border:1px solid rgba(255,45,85,.5);color:#ffb3c8;font:11px ui-monospace,monospace;letter-spacing:.14em;padding:10px;border-radius:8px;cursor:pointer}#setclose{position:absolute;top:10px;right:12px;background:none;border:none;color:#7fb6c9;font-size:18px;cursor:pointer}.ttt{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin-top:8px}.ttt button{width:56px;height:56px;border:1px solid rgba(0,229,255,.5);background:rgba(0,229,255,.07);color:#eafcff;font:20px ui-monospace,monospace;cursor:pointer;border-radius:8px;padding:0}.ttt button:disabled{opacity:.55;cursor:default}.ttt button.win{background:rgba(255,79,216,.25);border-color:var(--pk)}.tttinfo{font-size:10.5px;color:#9fe8ff;margin-top:6px;letter-spacing:.08em}</style>
</head>
<body>
<div id="bg"></div>
<canvas id="particles"></canvas>
<div class="wrap">
<header>
<div class="orb"></div>
<div class="tmeta"><h1>F R I D A Y</h1><div class="sub">TREVOR'S PERSONAL AI · V7</div></div>
<div class="tclock"><div id="clock">--:--:--</div><div id="cdate"></div></div>
</header>
<div id="statusbar"><span class="dot"></span><span id="stat">ALL SYSTEMS NOMINAL</span><span id="cooldown"></span></div>
<div id="hud">
<div class="gauge"><b>PWR CORE</b><i id="g1">98%</i><s><span id="b1" style="width:98%"></span></s></div>
<div class="gauge"><b>NET LINK</b><i id="g2">--</i><s><span id="b2" style="width:60%"></span></s></div>
<div class="gauge"><b>MEMORY</b><i id="g3">--</i><s><span id="b3" style="width:40%"></span></s></div>
<div class="gauge"><b>UPTIME</b><i id="g4">0s</i><s><span id="b4" style="width:14%"></span></s></div>
</div>
<div id="chat"></div>
<div class="tools">
<span class="chip" data-t="wiki ">WIKI</span>
<span class="chip" data-t="weather in ">WEATHER</span>
<span class="chip" data-t="tic-tac-toe">TIC TAC TOE</span>
<span class="chip" data-t="joke">JOKE</span>
<span class="chip" data-t="fact">FACT</span>
<span class="chip" data-t="research ">RESEARCH</span>
<span class="chip" data-t="7-day weather in ">FORECAST</span>
<span class="chip" data-t="image ">IMAGE</span>
<span class="chip" data-t="fx 100 usd to ">FX</span>
<span class="chip" data-t="remind me in 10 minutes ">REMIND</span>
<span class="chip" data-t="calc ">CALC</span>
<span class="chip" data-t="translate ">TRANSLATE</span>
<span class="chip" data-t="define ">DEFINE</span>
<span class="chip" data-t="read ">READ</span>
<span class="chip" id="settoggle">SETTINGS</span>
<span class="chip" id="voicetoggle">VOICE</span>
<span class="chip" id="memtoggle">MEMORY</span>
</div>
<div id="composer">
<textarea id="inp" rows="1" placeholder="talk to friday..."></textarea>
<button id="mic" title="speak">&#127908;</button>
<button id="send" title="send">&#10148;</button>
</div>
</div>
<div id="boot">
<div id="bootring"></div>
<div id="bootbar"><span id="bootfill"></span></div>
<div id="bootlog"></div>
<div id="boottap">TAP TO SKIP</div>
</div>
<div id="setpanel">
<button id="setclose">&times;</button>
<h2>SETTINGS</h2>
<label>WHAT FRIDAY CALLS YOU</label>
<input id="setname" type="text" maxlength="20">
<label>VOICE SPEED <span id="setratev" style="color:#9fe8ff"></span></label>
<input id="setrate" type="range" min="0.6" max="1.6" step="0.05">
<label>THEME</label>
<div id="themes">
<span class="chip" data-th="cyber">CYAN</span>
<span class="chip" data-th="crimson">CRIMSON</span>
<span class="chip" data-th="matrix">MATRIX</span>
<span class="chip" data-th="gold">GOLD</span>
</div>
<button id="clearchat">CLEAR CHAT HISTORY</button>
</div>
<div id="mempanel">
<button id="memclose">&times;</button>
<h2>MEMORY VAULT</h2>
<div id="memlist"></div>
<input id="memadd" placeholder="add something friday should always know...">
</div>
<script src="app.js"></script>
</body>
</html>
