<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EMPIRE OS 25 — Agent Command Center</title>
<meta name="theme-color" content="#05060c"/>
<style>
:root{--bg:#05060c;--panel:#0d101c;--line:#1c2338;--tx:#e8ecf8;--dim:#8b93ad;--acc:#f5c542;--ok:#3ddc84;--bad:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,'SF Pro Text',Helvetica,Arial,sans-serif;padding-bottom:76px}
header{display:flex;align-items:center;gap:10px;padding:14px 14px 6px}
header h1{font-size:17px;font-weight:700;letter-spacing:.4px}
header .back{color:var(--dim);text-decoration:none;font-size:13px;margin-left:auto}
main{padding:10px 12px}
.sect{display:none}.sect.on{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.card b{display:block;font-size:14px}
.card .role{color:var(--dim);font-size:11.5px;margin-top:2px}
.card .st{font-size:11px;margin-top:6px;color:var(--ok)}
.card .st.busy{color:var(--acc)}
.dept{font-size:10px;letter-spacing:1.2px;color:var(--acc);text-transform:uppercase;margin:14px 0 4px}
input,textarea,select{width:100%;background:#111527;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:64px;resize:vertical}
.btn{display:inline-block;background:var(--acc);color:#141200;border:none;border-radius:10px;padding:11px 14px;font-weight:700;font-size:14px;margin-top:8px;width:100%}
.btn.ghost{background:#1a2136;color:var(--tx)}
.row{margin-top:10px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.item .meta{color:var(--dim);font-size:11.5px;margin-top:3px;white-space:pre-wrap}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin-right:6px}
.tag.ok{color:var(--ok);border-color:#1d5c3a}
.tag.warn{color:var(--acc);border-color:#5c4a1d}
.msg{padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.msg b{color:var(--acc)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a0d18;border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:none;color:var(--dim);font-size:11px;padding:10px 2px 12px}
nav button.on{color:var(--acc);font-weight:700}
#chat{position:fixed;inset:0;background:rgba(5,6,12,.97);display:none;flex-direction:column;padding:14px;z-index:9}
#chat.on{display:flex}
#chat h2{font-size:16px;margin-bottom:4px}
#chatlog{flex:1;overflow-y:auto;padding:8px 0}
.bub{max-width:88%;padding:9px 11px;border-radius:12px;margin:5px 0;font-size:14px;white-space:pre-wrap}
.bub.me{background:#223059;margin-left:auto}
.bub.ai{background:#171c2e}
#chatbar{display:flex;gap:8px;padding-top:8px}
#chatbar input{flex:1}
#chatbar button{width:auto;padding:10px 16px}
.err{color:var(--bad);font-size:12px;margin-top:6px}
.two{display:flex;gap:8px}.two>*{flex:1}
</style></head>
<body>
<header><h1>EMPIRE OS 25</h1><span class="tag" id="brainst">brain: checking…</span><a class="back" href="./index.html">← Empire OS</a></header>
<main>
<section class="sect on" id="sec-agents">
  <div class="row"><input id="taskIn" placeholder="Give your empire a mission…"/><button class="btn" id="assignBtn">Run mission</button><div class="err" id="taskErr"></div></div>
  <div id="agentsWrap"></div>
</section>
<section class="sect" id="sec-bus"><h3 style="margin:6px 0">Agent-to-agent bus</h3><div id="busList"></div><button class="btn ghost" id="exportBtn">Download backup</button></section>
<section class="sect" id="sec-hunt"><div class="row"><button class="btn" id="huntBtn">Hunt opportunities</button><div class="err" id="huntErr"></div></div><div id="huntOut"></div></section>
<section class="sect" id="sec-factory"><div class="row"><textarea id="factIn" placeholder="Business idea…"></textarea><button class="btn" id="factBtn">Build the plan</button><div class="err" id="factErr"></div></div><div id="factOut"></div></section>
<section class="sect" id="sec-port"><div class="row two"><input id="portName" placeholder="Venture name"/><button class="btn ghost" id="portAdd">Add</button></div><div id="portList"></div></section>
<section class="sect" id="sec-appr"><div class="row"><input id="apprWhat" placeholder="What needs approval (e.g. post to X)"/><button class="btn ghost" id="apprAdd">Queue approval</button></div><div id="apprList"></div></section>
</main>
<div id="chat"><h2 id="chatName"></h2><div id="chatlog"></div><div class="row"><button class="btn ghost" id="chatClose">Close</button></div><div id="chatbar"><input id="chatIn" placeholder="Message this agent…"/><button class="btn" id="chatSend">Send</button></div><div class="err" id="chatErr"></div></div>
<nav>
<button data-s="agents" class="on">Agents</button><button data-s="bus">Bus</button><button data-s="hunt">Hunt</button><button data-s="factory">Factory</button><button data-s="port">Portfolio</button><button data-s="appr">Approvals</button>
</nav>
<script>
'use strict';
var AGENTS=[
['ceo','ATLAS','Command','Chief executive. Turns missions into concrete plans with owners, budget $0, and a 7-day timeline.'],
['coo','FORGE','Command','Chief operations. Turns plans into daily task lists and tracks what is blocked.'],
['cfo','LEDGER','Command','Chief finance. Budgets with free tools and $0 spend only. Flags anything that costs money.'],
['cmo','NOVA','Command','Chief marketing. Brands, positioning and launch copy.'],
['cto','AXIOM','Command','Chief tech. Picks free infrastructure and no-card services.'],
['hunter','HUNTER','Growth','Opportunity hunter. Finds specific, current opportunities to make money with zero budget.'],
['scout','SCOUT','Growth','Market scout. Sizes demand and names the first ten likely customers.'],
['leads','PROSPECT','Growth','Lead generation. Lists concrete lead sources and first messages.'],
['outreach','MESSENGER','Growth','Writes outreach drafts. Never sends anything: drafts go to the approval queue.'],
['closer','CLOSER','Growth','Closing. Writes offers, follow-ups and objection answers.'],
['architect','BLUEPRINT','Factory','Product architect. Turns an idea into a build plan with versions.'],
['builder','MASON','Factory','Builds. Writes actual copy, code outlines and assets step by step.'],
['qa','INSPECTOR','Factory','Quality. Finds the three weakest points of any work and fixes them.'],
['deploy','LAUNCHPAD','Factory','Deployment. Free hosting and distribution only, no card ever.'],
['librarian','SHELF','Factory','Librarian. Organizes every asset the empire produces and indexes it.'],
['inbox','GATEKEEPER','Ops','Inbox triage. Sorts messages by urgency and drafts replies for approval.'],
['scheduler','CLOCK','Ops','Scheduling. Proposes time blocks for the mission week.'],
['bookkeeper','BALANCE','Ops','Money tracking. Logs income and costs at $0 baseline.'],
['reporter','HERALD','Ops','Daily brief. Turns bus activity into a 5-line report.'],
['archivist','VAULT','Ops','Memory keeper of operations. Keeps the decision log.'],
['trends','RADAR','Intel','Trend radar. Names what is rising now and how to ride it free.'],
['competitor','SPYGLASS','Intel','Competitor watch. Profiles rivals and their gaps.'],
['risk','SENTINEL','Intel','Risk sentinel. Flags scams, platform bans and legal tripwires before action.'],
['memory','MIND','Intel','Long-term memory. Recalls every prior decision and lesson.'],
['whisper','ORACLE','Intel','Customer voice. Predicts what customers will say and want next.']];
var DEPTS={};AGENTS.forEach(function(a){(DEPTS[a[2]]=DEPTS[a[2]]||[]).push(a)});
var K='ea25_v1';
var S=JSON.parse(localStorage.getItem(K)||'null')||{tasks:[],msgs:[],approvals:[],portfolio:[],chats:{}};
function save(){localStorage.setItem(K,JSON.stringify(S))}
function esc(s){return (s||'').replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function byId(id){for(var i=0;i<AGENTS.length;i++)if(AGENTS[i][0]===id)return AGENTS[i];return null}
function bus(from,to,text){S.msgs.push({f:from,t:to,x:text,at:Date.now()});save();renderBus()}
function renderAgents(){
 var w=document.getElementById('agentsWrap');w.innerHTML='';
 Object.keys(DEPTS).forEach(function(d){
  var h='<div class="dept">'+d+'</div><div class="grid">';
  DEPTS[d].forEach(function(a){
   var busy=S.tasks.some(function(t){return t.agent===a[0]&&t.status==='working'});
   h+='<div class="card" data-a="'+a[0]+'"><b>'+a[1]+'</b><div class="role">'+esc(a[3].split('.')[0])+'</div><div class="st'+(busy?' busy':'')+'">'+(busy?'working':'idle')+' · tap to chat</div></div>';
  });
  w.innerHTML+=h+'</div>';
 });
 w.querySelectorAll('.card').forEach(function(c){c.onclick=function(){openChat(c.getAttribute('data-a'))}});
}
function renderBus(){
 var l=document.getElementById('busList');
 l.innerHTML=S.msgs.slice(-60).reverse().map(function(m){var f=byId(m.f),t=byId(m.t);return '<div class="msg"><b>'+(f?f[1]:m.f)+'</b> → '+(t?t[1]:m.t)+'<div class="meta">'+esc(m.x)+'</div></div>'}).join('')||'<div class="item">No traffic yet. Run a mission and the bus lights up.</div>';
}
function renderPort(){
 var l=document.getElementById('portList');
 l.innerHTML=S.portfolio.slice().reverse().map(function(v){return '<div class="item"><b>'+esc(v.name)+'</b><div class="meta">'+esc(v.note||'')+'</div><div class="meta">'+new Date(v.at).toLocaleDateString()+' <span class="tag">'+esc(v.status||'idea')+'</span></div><button class="btn ghost" data-del="'+v.at+'">Remove</button></div>'}).join('')||'<div class="item">Nothing in the portfolio yet.</div>';
 l.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var t=b.getAttribute('data-del');S.portfolio=S.portfolio.filter(function(v){return String(v.at)!==t});save();renderPort()}});
}
function renderAppr(){
 var l=document.getElementById('apprList');
 l.innerHTML=S.approvals.slice().reverse().map(function(a){var st=a.status||'waiting';var cls=st==='approved'?'ok':(st==='denied'?'warn':'');return '<div class="item"><b>'+esc(a.what)+'</b><div class="meta"><span class="tag '+cls+'">'+st+'</span>'+esc(a.draft||'')+'</div>'+(st==='waiting'?'<div class="two"><button class="btn ghost" data-ok="'+a.at+'">Approve draft</button><button class="btn ghost" data-no="'+a.at+'">Deny</button></div>':'<button class="btn ghost" data-no="'+a.at+'">Clear</button>')+'</div>'}).join('')||'<div class="item">Nothing queued. Good sign.</div>';
 l.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){var it=S.approvals.find(function(x){return String(x.at)===b.getAttribute('data-ok')});if(it){it.status='approved';it.draft=it.draft||('DRAFT (send via Fo): '+it.what);save();renderAppr()}}});
 l.querySelectorAll('[data-no]').forEach(function(b){b.onclick=function(){var it=S.approvals.find(function(x){return String(x.at)===b.getAttribute('data-no')});if(it){it.status=it.status==='waiting'?'denied':'cleared';save();renderAppr()}}});
}
function brain(msgs,onDelta,done,fail){
 var tries=0,url='https://text.pollinations.ai/openai';
 function go(){
  tries++;
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai-fast',stream:true,messages:msgs})}).then(function(r){
   if(!r.ok||!r.body)throw 0;
   var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
   function step(){return rd.read().then(function(res){
    if(res.done){done();return}
    buf+=dec.decode(res.value,{stream:true});
    var lines=buf.split('\n');buf=lines.pop();
    lines.forEach(function(ln){ln=ln.trim();if(ln.indexOf('data:')!==0)return;var p=ln.slice(5).trim();if(p==='[DONE]')return;try{var j=JSON.parse(p);var d=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(d)onDelta(d)}catch(e){}});
    return step();
   })}
   return step();
  }).catch(function(){
   if(tries<3){document.getElementById('brainst').textContent='brain busy, retry '+tries+'/3';setTimeout(go,3000);return}
   var last=msgs[msgs.length-1].content;
   fetch('https://text.pollinations.ai/'+encodeURIComponent(last)+'?model=openai-fast').then(function(r){return r.text()}).then(function(t){onDelta(t);done()}).catch(function(){fail&&fail()});
  });
 }
 go();
}
function setBrain(){fetch('https://text.pollinations.ai/ping').then(function(){document.getElementById('brainst').textContent='brain: online'}).catch(function(){document.getElementById('brainst').textContent='brain: retrying…'})}
var chatAgent=null;
function openChat(id){
 chatAgent=id;var a=byId(id);
 document.getElementById('chatName').textContent=a[1]+' · '+a[2];
 document.getElementById('chatErr').textContent='';
 var log=document.getElementById('chatlog');log.innerHTML='';
 (S.chats[id]||[]).forEach(function(m){addBub(m.r,m.x)});
 document.getElementById('chat').classList.add('on');
}
function addBub(role,text){
 var d=document.createElement('div');d.className='bub '+(role==='me'?'me':'ai');d.textContent=text;
 document.getElementById('chatlog').appendChild(d);document.getElementById('chatlog').scrollTop=1e6;return d;
}
function chatSend(){
 var inp=document.getElementById('chatIn'),q=inp.value.trim();if(!q||!chatAgent)return;
 inp.value='';var a=byId(chatAgent);
 S.chats[chatAgent]=S.chats[chatAgent]||[];S.chats[chatAgent].push({r:'me',x:q});save();addBub('me',q);
 var bub=addBub('ai','…');var hist=S.chats[chatAgent].slice(-10).map(function(m){return{role:m.r==='me'?'user':'assistant',content:m.x}});
 brain([{role:'system',content:'You are '+a[1]+', '+a[3]+' Inside EMPIRE OS, a 25-agent AI business command center. Be direct and concrete. $0 budget only. Never claim you sent or spent anything; route external actions to the approval queue.'}].concat(hist),
 function(d){if(bub.textContent==='…')bub.textContent='';bub.textContent+=d},
 function(){S.chats[chatAgent].push({r:'ai',x:bub.textContent});save()},
 function(){bub.textContent='(the free brain is busy — tap send again)'});
}
function assignMission(){
 var t=document.getElementById('taskIn'),goal=t.value.trim();var e=document.getElementById('taskErr');
 if(!goal){e.textContent='Type a mission first.';return}
 e.textContent='';t.value='';
 S.tasks.push({agent:'ceo',goal:goal,status:'working',at:Date.now()});save();renderAgents();
 var holder=document.getElementById('huntOut');
 var plan='';
 bus('ceo','bus','Mission received: '+goal+'. Planning.');
 var ceoMsgs=[{role:'system',content:'You are ATLAS, chief executive of a 25-agent AI business. $0 budget. Produce a tight 7-day plan: goal, 4 steps each with an owner agent and first action, and the one metric to watch.'},{role:'user',content:goal}];
 var it=S.tasks[S.tasks.length-1];
 var d=document.createElement('div');d.className='item';d.innerHTML='<b>ATLAS planning…</b><div class="meta plan"></div>';holder.prepend(d);
 var meta=d.querySelector('.meta');
 brain(ceoMsgs,function(x){plan+=x;meta.textContent=plan},
 function(){
  it.status='done';it.result=plan;save();renderAgents();
  bus('ceo','coo','Plan ready. FORGE, break it into daily tasks.');
  var mates=['coo','hunter','nova'];
  mates.forEach(function(mid,ix){
   setTimeout(function(){
    bus('ceo',mid,'Plan assigned to you: '+plan.slice(0,300));
    var m=byId(mid);var mm=[{role:'system',content:'You are '+m[1]+', '+m[3]+' One short paragraph, concrete, $0.'},{role:'user',content:'Your piece of this plan: '+plan.slice(0,800)+' Reply with your first action only.'}];
    var dd=document.createElement('div');dd.className='item';dd.innerHTML='<b>'+m[1]+' working…</b><div class="meta"></div>';holder.prepend(dd);var me2=dd.querySelector('.meta');var out='';
    brain(mm,function(x){out+=x;me2.textContent=out},function(){bus(mid,'bus','Done: '+out.slice(0,200))},function(){me2.textContent='(free brain busy — rerun the mission)'});
   },ix*4000);
  });
 },
 function(){meta.textContent='(the free brain is busy — tap Run mission again)'});
}
function hunt(){
 var o=document.getElementById('huntOut'),e=document.getElementById('huntErr');e.textContent='';
 o.innerHTML='<div class="item"><b>HUNTER</b><div class="meta"></div></div>';var m=o.querySelector('.meta');var acc='';
 var msgs=[{role:'system',content:'You are HUNTER, opportunity hunter in EMPIRE OS. Give exactly 3 opportunities to make money this week with $0 budget, each one line of what, one line of first step, one line of realistic first-week income. Numbered 1-3.'},{role:'user',content:'Hunt now.'}];
 brain(msgs,function(x){acc+=x;m.textContent=acc},function(){
  for(var i=1;i<=3;i++){var idx=acc.indexOf(i+'.');if(idx>-1){var nxt=acc.indexOf((i+1)+'.');var line=acc.slice(idx+2,nxt>-1?nxt:undefined).trim().split('\n')[0];
   S.portfolio.push({name:'Opportunity '+i,note:line,status:'idea',at:Date.now()})}
  }
  save();renderPort();
 },function(){m.textContent='(free brain busy — tap Hunt again)'});
}
function factory(){
 var i=document.getElementById('factIn'),v=i.value.trim(),e=document.getElementById('factErr');
 if(!v){e.textContent='Type the idea first.';return}
 e.textContent='';var o=document.getElementById('factOut');o.innerHTML='<div class="item"><b>BLUEPRINT + MASON building…</b><div class="meta"></div></div>';var m=o.querySelector('.meta');var acc='';
 var msgs=[{role:'system',content:'You are BLUEPRINT and MASON of EMPIRE OS. Build the business plan: NAME, OFFER (one line), PRICE, FIRST CUSTOMER (who and where), 3 BUILD STEPS with the free tool for each, FIRST-WEEK GOAL. $0 budget, free tools only.'},{role:'user',content:v}];
 brain(msgs,function(x){acc+=x;m.textContent=acc},function(){
  S.portfolio.push({name:v.slice(0,40),note:acc,status:'plan',at:Date.now()});save();renderPort();bus('architect','shelf','New venture plan filed in the portfolio.');
 },function(){m.textContent='(free brain busy — tap Build again)'});
}
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
 document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');
 document.querySelectorAll('.sect').forEach(function(s){s.classList.remove('on')});
 document.getElementById('sec-'+b.getAttribute('data-s')).classList.add('on');
}});
document.getElementById('chatClose').onclick=function(){document.getElementById('chat').classList.remove('on');chatAgent=null};
document.getElementById('chatSend').onclick=chatSend;
document.getElementById('chatIn').addEventListener('keydown',function(e){if(e.key==='Enter')chatSend()});
document.getElementById('assignBtn').onclick=assignMission;
document.getElementById('huntBtn').onclick=hunt;
document.getElementById('factBtn').onclick=factory;
document.getElementById('portAdd').onclick=function(){var n=document.getElementById('portName').value.trim();if(!n)return;S.portfolio.push({name:n,note:'',status:'idea',at:Date.now()});save();renderPort();document.getElementById('portName').value=''};
document.getElementById('apprAdd').onclick=function(){var w=document.getElementById('apprWhat').value.trim();if(!w)return;S.approvals.push({what:w,status:'waiting',at:Date.now()});save();renderAppr();document.getElementById('apprWhat').value=''};
document.getElementById('exportBtn').onclick=function(){
 var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='empire-os-25-backup.json';a.click();
};
renderAgents();renderBus();renderPort();renderAppr();setBrain();
</script>
</body></html>
