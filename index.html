<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a12">
<title>EditForge AI — TikTok edit studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="scr-home" class="screen active">
    <div class="brand"><div class="logo">EF</div><h1>EditForge<span> AI</span></h1></div>
    <p class="tag">drop your clips, pick a vibe, get a real edit. everything stays on your phone.</p>
    <button id="btn-new" class="btn primary big">＋ start an edit</button>
    <div id="home-msg" class="msg ok" hidden></div>
    <p class="fine">made for 9:16 · runs in your browser · no upload, no account</p>
    <p class="fine">stuck? <a href="sms:+16282873538">text Fo</a></p>
  </section>

  <!-- STUDIO -->
  <section id="scr-studio" class="screen">
    <header class="bar"><button class="back" id="btn-back">‹</button><h2>new edit</h2></header>
    <div class="pad">
      <label class="lbl">1 · your clips &amp; pics</label>
      <button id="btn-add" class="btn ghost wide">＋ add clips / photos</button>
      <input id="file-media" type="file" accept="video/*,image/*" multiple hidden>
      <div id="tray" class="tray"></div>
      <div id="tray-msg" class="msg err" hidden></div>

      <label class="lbl">2 · the music (optional but fire)</label>
      <button id="btn-music" class="btn ghost wide">♪ add a song</button>
      <input id="file-music" type="file" accept="audio/*" hidden>
      <div id="music-row" class="music-row" hidden><span id="music-name"></span><button id="btn-music-x" class="x">✕</button></div>
      <div id="music-msg" class="msg" hidden></div>

      <label class="lbl">3 · the vibe</label>
      <input id="brief" type="text" placeholder="describe it… e.g. insane spiderman phonk edit" autocomplete="off">
      <div class="chips" id="chips">
        <button class="chip" data-style="spiderman">spider-man</button>
        <button class="chip" data-style="phonk">phonk</button>
        <button class="chip" data-style="cinematic">cinematic</button>
        <button class="chip" data-style="emotional">emotional</button>
      </div>
      <label class="lbl sm">speed <span id="inten-val">insane</span></label>
      <input id="inten" type="range" min="0" max="100" value="75">
      <label class="lbl">hook text (big caption at the start)</label>
      <input id="hook" type="text" placeholder="optional… e.g. HE DIDN'T SEE IT COMING" autocomplete="off">

      <button id="btn-make" class="btn primary big">⚡ make my edit</button>
      <div id="make-msg" class="msg" hidden></div>
    </div>
  </section>

  <!-- PLAYER -->
  <section id="scr-player" class="screen">
    <header class="bar"><button class="back" id="btn-back-player">‹</button><h2>your edit</h2><button id="btn-restyle" class="linkbtn">tweak</button></header>
    <div class="stage"><canvas id="cv" width="720" height="1280"></canvas></div>
    <div class="ctrls">
      <button id="btn-play" class="btn primary round">▶</button>
      <div class="tl"><div id="tl-fill"></div></div>
    </div>
    <div class="pad center">
      <div id="dur-note" class="fine"></div>
      <button id="btn-export" class="btn primary big">⬇ save the video</button>
      <div id="exp-box" hidden>
        <div class="pbar"><div id="exp-fill"></div></div>
        <div id="exp-note" class="fine">rendering in real time… keep this screen open</div>
        <a id="dl" class="btn primary big" hidden>⬇ save to files</a>
      </div>
      <div id="exp-msg" class="msg" hidden></div>
    </div>
  </section>

</div>
<script src="ef-core.js"></script>
<script src="ef-director.js"></script>
<script src="ef-engine.js"></script>
<script src="ef-ui.js"></script>
</body>
</html>
