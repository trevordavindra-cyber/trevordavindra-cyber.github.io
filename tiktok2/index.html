<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULTIMATE AI TIKTOK EDIT MAKER</title>
<link rel="stylesheet" href="style.css?v=27">
</head>
<body>
<header>
<h1>🎬 ULTIMATE AI TIKTOK EDIT MAKER</h1>
<p class="sub">upload clips → auto edit → export. everything runs in your browser</p>
</header>
<main>
<section class="card" id="library">
<h2>LIBRARY</h2>
<div id="drop" class="drop">drop videos here or <label class="lbl" for="file">choose files</label></div>
<input type="file" id="file" accept="video/*" multiple style="display:none">
<div id="libgrid" class="grid"></div>
</section>
<section class="card" id="editor">
<h2>TIMELINE</h2>
<div id="tl" class="tl"></div>
<div class="row">
<button id="auto">AUTO EDIT</button>
<button id="addtext">+ TEXT</button>
<button id="addmusic">+ MUSIC</button>
<button id="undo">UNDO</button>
<button id="redo">REDO</button>
<button id="speed">SPEED</button>
<button id="split">SPLIT</button>
<button id="dup">DUPLICATE</button>
<button id="merge">MERGE</button>
<button id="rev">REVERSE</button>
<button id="mute">MUTE CLIP</button>
<button id="vol">VOLUME</button>
<button id="zpad">ZOOM</button>
<button id="fit">FIT ALL</button>
<button id="clr">CLEAR</button>
</div>
<div id="propbar"></div>
</section>
<section class="card" id="fxpanel">
<h2>FX + CAPTIONS</h2>
<div class="row">
<button id="capadd">+ CAPTION</button>
<button id="capstyle">CAPTION STYLE</button>
<button id="fxshake">SHAKE</button>
<button id="fxzoom">ZOOM PUNCH</button>
<button id="fxglitch">GLITCH</button>
<button id="fxflash">FLASH</button>
<button id="fxrgb">RGB SPLIT</button>
<button id="fxfade">FADE</button>
<button id="fxfilm">FILM GRAIN</button>
<button id="fxvig">VIGNETTE</button>
</div>
</section>
<section class="card" id="audiopanel">
<h2>AUDIO</h2>
<div class="row">
<label class="lbl" for="musicfile">+ SONG</label><input type="file" id="musicfile" accept="audio/*" style="display:none">
<button id="beat">BEAT MAP</button>
<button id="autobeat">CUT TO BEAT</button>
<button id="duck">AUTO DUCK</button>
<button id="norm">NORMALIZE</button>
<button id="sfxbank">SFX</button>
<button id="volmix">MIXER</button>
</div>
<div id="wave"></div>
</section>
<section class="card" id="preview">
<h2>PREVIEW + EXPORT</h2>
<div class="row">
<button id="play">▶ PLAY</button>
<button id="stop">■ STOP</button>
<button id="export">● EXPORT MP4</button>
<button id="exportsrt">⬇ SRT</button>
<button id="saveproj">💾 SAVE PROJECT</button>
<button id="loadproj">📂 LOAD PROJECT</button>
</div>
<canvas id="cv" width="720" height="1280"></canvas>
<div class="bar"><i id="pbi"></i></div>
</section>
<section class="card" id="hubs">
<h2>LABS</h2>
<div id="labs"></div>
</section>
<section class="card" id="logcard">
<h2>LOG</h2>
<div id="log"></div>
</section>
</main>
