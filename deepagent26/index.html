<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ChatGPT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23fff'/%3E%3Cpath d='M12 3.5a8.5 8.5 0 1 0 8.5 8.5h-3.2' fill='none' stroke='%230d0d0d' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div id="app">
 <div id="drawer">
  <div class="shead"><b>ChatGPT</b></div>
  <button class="sitem" id="newchatd"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <div class="ssect"><svg class="ric" viewBox="0 0 24 24"><path d="M8 6h10M8 12h10M8 18h10"/></svg>Chats</div>
  <div id="dchats"></div>
  <div id="dshare" class="sitem"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 21h14"/></svg>Copy chat</button></div>
  <div id="dbottom"><div class="davatar"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/></svg></div><span>ChatGPT</span><svg class="ric" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
 </div>
 <div id="dback"></div>
 <div id="main">
  <div id="top">
   <div class="tleft">
    <button class="circ" id="menu" title="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button id="brand"><b>ChatGPT</b><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
   </div>
   <div class="tright">
    <button class="circ" id="mute" title="sound"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button>
    <button class="circ" id="newchat" title="new chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M12.5 3.5l8 8L14 18l-4.5.5.5-4.5z"/></svg></button>
    <button class="circ" id="pfp" title="account"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M5.5 19a7.5 7.5 0 0 1 13 0"/></svg></button>
   </div>
  </div>
  <div id="chat">
   <div id="welcome">
    <svg class="mark big" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5h-3.2"/></svg>
    <h1 id="hero">Where should we begin?</h1>
    <div id="wsugg"></div>
   </div>
  </div>
  <div id="composer">
   <div class="ccard">
    <textarea id="inp" placeholder="Ask anything" rows="1"></textarea>
    <div id="chiprow">
     <button id="plus" title="add files"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
     <button class="chip" id="thinkchip"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 3.5 10.9c-.5.4-.8 1-.8 1.6v.5h-5.4v-.5c0-.6-.3-1.2-.8-1.6A6 6 0 0 1 12 3zM10 19h4"/></svg>Think</button>
     <button class="chip" id="searchchip"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</button>
     <button id="mic" title="voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
     <button id="send" title="send"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" stroke="none"/><path d="M12 17V8M8.5 11.5 12 8l3.5 3.5" stroke="#fff"/></svg></button>
    </div>
   </div>
  </div>
 </div>
 <input type="file" id="file" style="display:none" accept="text/*,.txt,.md,.json,.csv,.js,.html,.css,.py">
 <aside id="trace"><h2 id="ctitle"></h2><div id="steps"></div></aside>
 <div id="sheet">
  <button id="sheetx" class="circ"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <h2>Settings</h2>
  <div class="card">
   <div class="row" data-go="acct"><span class="lb">Account</span><span class="val">›</span></div>
   <div class="row" data-go="pers"><span class="lb">Personalization</span><span class="val">›</span></div>
   <div class="row" data-go="data"><span class="lb">Data controls</span><span class="val">›</span></div>
   <div class="row" id="appear"><span class="lb">Appearance</span><span class="val" id="apval">System</span></div>
  </div>
  <div class="card">
   <div class="row" id="mrow"><span class="lb">Model</span><span class="val" id="mval">free relay ›</span></div>
   <div class="row"><span class="lb">Agent mode</span><span class="val" id="agval">on</span></div>
  </div>
  <div class="card">
   <div class="row" id="agmt"><span class="lb">Service agreement</span><span class="val">›</span></div>
   <div class="row" id="upd"><span class="lb">Check for updates</span><span class="val">2.9.4(11)</span></div>
   <div class="row" id="help"><span class="lb">Feedback &amp; support</span><span class="val">›</span></div>
   <div class="row" id="logout"><span class="lb">Log out</span></div>
  </div>
 </div>
 <div id="panel">
  <div class="phead"><button class="circ" id="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b id="ptitle">Settings</b><span style="flex:1"></span><button class="circ" id="panx"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="pbody"></div>
 </div>
 <div id="cback"></div>
 <div id="ctx"></div>
</div>
<script src="app.js?v=6"></script>
<script src="up.js?v=1"></script>
<script src="up2.js?v=1"></script>
<script src="up3.js?v=1"></script>
<script src="up4.js?v=3"></script>
<script src="up5.js?v=1"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
</html>
