<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ILLUMINATI — the one hub</title>
<meta name="description" content="Every site we ever built together, one hub.">
<style>
:root{--cyan:#00e5ff;--red:#ff2d55;--bg:#07070d;--card:#0d0d17;--line:#1c1c2e;--txt:#e6f7ff;--dim:#7a8aa0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh;
background-image:radial-gradient(circle at 15% 10%,rgba(255,45,85,.08),transparent 40%),radial-gradient(circle at 85% 20%,rgba(0,229,255,.07),transparent 45%),linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:auto,auto,44px 44px,44px 44px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}
header{text-align:center;padding:26px 0 10px}
h1{font-size:clamp(30px,7vw,52px);letter-spacing:.14em;color:#fff;text-shadow:0 0 18px rgba(0,229,255,.45),0 0 44px rgba(255,45,85,.25)}
h1 span{color:var(--cyan)}
.tag{color:var(--dim);letter-spacing:.28em;text-transform:uppercase;font-size:11px;margin-top:8px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.stat{border:1px solid var(--line);background:rgba(13,13,23,.8);border-radius:10px;padding:8px 14px;font-size:12px}
.stat b{color:var(--cyan)}
#q{width:100%;max-width:460px;display:block;margin:16px auto 0;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px 14px;font:inherit;outline:none}
#q:focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(0,229,255,.35)}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}
.fchip{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:999px;padding:7px 16px;font:inherit;font-size:11px;letter-spacing:.14em}
.fchip.on{color:#04222b;background:var(--cyan);border-color:var(--cyan);font-weight:700}
.fchip:hover{border-color:var(--cyan);color:var(--cyan)}
.fchip.on:hover{color:#04222b}
.sec{margin-top:26px}
.sec h2{font-size:13px;letter-spacing:.22em;color:var(--red);text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.18s}
.card:hover{border-color:rgba(0,229,255,.5);box-shadow:0 0 24px rgba(0,229,255,.08)}
.card.feat{border-color:rgba(255,45,85,.35)}
.name{font-size:14px;font-weight:700;color:#fff;letter-spacing:.04em}
.desc{font-size:12px;color:var(--dim);line-height:1.45;flex:1}
.row{display:flex;gap:8px}
.btn{flex:1;cursor:pointer;border-radius:8px;padding:9px 10px;font:inherit;font-size:11px;letter-spacing:.08em;border:1px solid var(--line);background:transparent;color:var(--txt);text-decoration:none;text-align:center}
.btn.open{background:var(--cyan);color:#04222b;border-color:var(--cyan);font-weight:700}
.btn.embed{color:var(--cyan)}
.btn:hover{filter:brightness(1.2)}
.chip{font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.arch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:10px;font-size:12px;color:var(--dim)}
.arch select,.arch input{background:#07070d;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px;font:inherit;font-size:12px;max-width:150px}
.arch .btn{flex:0 0 auto;padding:8px 14px}
footer{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.14em;margin-top:44px}
.ictile{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#04141a;flex:0 0 auto;box-shadow:0 0 14px rgba(0,229,255,.12)}
.crow{display:flex;gap:10px;align-items:flex-start}
.crow>div:last-of-type{flex:1;min-width:0}
.bdg{font-size:10px;color:var(--cyan);border:1px solid rgba(0,229,255,.4);border-radius:999px;padding:2px 8px;white-space:nowrap}
.launches{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.lcard .rank{font-size:11px;color:var(--red);font-weight:800;letter-spacing:.1em}
.lcard .nm{font-size:12px;color:#fff;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard .ct{font-size:12px;color:var(--cyan);font-weight:800}
.feed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;color:var(--dim);line-height:1.8}
.feed b{color:var(--cyan);font-weight:700}
footer b{color:var(--cyan)}
#ov{position:fixed;inset:0;background:rgba(3,3,8,.92);display:none;z-index:50;flex-direction:column}
#ov.on{display:flex}
#ovbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
#ovbar span{font-size:12px;color:var(--cyan);letter-spacing:.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#ovframe{flex:1;border:0;width:100%;background:#000}
@media(max-width:480px){.grid{grid-template-columns:1fr}.stat{font-size:11px;padding:6px 10px}.fchip{padding:6px 12px;font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>ILLUMIN<span>ATI</span></h1>
<div class="tag">one hub · every site · zero removals</div>
<div class="stats" id="stats"></div>
</header>
<input id="q" placeholder="search the vault" autocomplete="off">
<div class="chips"><button class="fchip on" data-c="all">ALL</button><button class="fchip" data-c="ai">AI</button><button class="fchip" data-c="tools">TOOLS</button><button class="fchip" data-c="games">GAMES</button><button class="fchip" data-c="infra">INFRA</button><button class="fchip" id="rand">SURPRISE ME 🎲</button></div>
<div class="sec" id="featsec"><h2>current builds</h2><div class="grid" id="feat"></div></div>
<div class="sec"><h2>the full arsenal</h2><div class="grid" id="rest"></div></div>
<div class="sec" id="decksec"><h2>launch deck</h2><div class="launches" id="deckgrid"></div><div class="feed" id="feedbox" style="margin-top:10px"></div></div>
<div class="sec"><h2>series archive</h2>
<div class="arch">every version of every series is still live. pick one:
<div class="row" style="margin-top:10px;flex-wrap:wrap">
<select id="a_series"><option value="hell">hell</option><option value="jarvis">jarvis</option><option value="friday">friday</option><option value="deepagent">deepagent</option><option value="fleet">fleet</option><option value="tiktok">tiktok</option></select>
<input id="a_num" type="number" min="1" placeholder="version #">
<button class="btn" id="a_go" style="max-width:110px">OPEN →</button>
<span id="a_max" style="align-self:center"></span>
</div></div></div>
<footer>built by <b>FO</b> for trevor · every site stays live at its own path · nothing was removed · v3</footer>
</div>
<div id="ov"><div id="ovbar"><span id="ovname"></span><button class="btn" style="flex:0 0 auto;max-width:90px" id="ovclose">CLOSE ✕</button><a class="btn open" style="flex:0 0 auto;max-width:120px" id="ovpop" target="_blank" href="#">FULL ↗</a></div><iframe id="ovframe" title="embedded site"></iframe></div>
<script>
'use strict';
var BASE='https://trevordavindra-cyber.github.io/';
var SITES=[
{n:'HELL 398',u:'hell398/',d:'The ILLUMINATI core. 398 builds deep — the newest hell path, catch-all 404 routes dead links here.',c:'ai',f:1},
{n:'J.A.R.V.I.S. 8',u:'jarvis8/',d:'Stark Industries HUD. Voice, arc-reactor status, global map, full-HUD phone view with view switcher.',c:'ai',f:1},
{n:'FRIDAY 7',u:'friday7/',d:"Trevor's personal AI. Chat, deep research, weather, games, voice both ways, memory vault, help + chat export.",c:'ai',f:1},
{n:'FRIDAYCHAT',u:'https://fridaychat.surge.sh/',d:'Full NextChat build on its own rail. ChatGPT-style app, model forced to the free relay.',c:'ai',f:1},
{n:'TIKTOK 2',u:'tiktok2/',d:'The ULTIMATE AI TIKTOK EDIT MAKER. 161 of 1000 features shipped — agents, styles, audio lab, creator analytics.',c:'tools',f:1},
{n:'SHORTFORGE',u:'tiktok3/',d:'The combined TikTok maker — six GitHub repos fused into one browser studio. Turbo, prompt, reddit, chat and clipper modes.',c:'tools',f:1},
{n:'TIKTOK 1',u:'tiktok1/',d:'The original TikTok edit generator. Topic to finished vertical video with captions and hashtags.',c:'tools',f:1},
{n:'DEEPAGENT 51',u:'deepagent51/',d:'Deep agent chat, 51 builds. Prompt chips, search-all-chats, stats, projects, backup and restore.',c:'ai',f:1},
{n:'FLEET 4',u:'fleet4/',d:'Fleet command: 100 agents, missions and security audit modes running in the browser.',c:'ai',f:1},
{n:'UNCENSORED AI',u:'uncensored-ai/',d:'UNCENSORED AI status build. Companion to the AI operating system.',c:'ai'},
{n:'UNCENSORED OS',u:'uncensored/',d:'UNCENSORED — the AI operating system.',c:'ai'},
{n:'NOVA',u:'nova/',d:'NOVA — the AI that actually helps.',c:'ai'},
{n:'SYNAPSE',u:'synapse/',d:'SYNAPSE — AI with attitude.',c:'ai'},
{n:'ORBIT',u:'orbit/',d:'ORBIT — the AI assistant that gets things done. Front end; its backend lives below.',c:'ai'},
{n:'ORBIT BACKEND',u:'orbit-backend/',d:'ORBIT backend services and API pages.',c:'infra'},
{n:'CLAUDEMOD',u:'claudemod/',d:'FreeMode — Claude-style multi-model chat.',c:'ai'},
{n:'HACKERAI',u:'hackerai/',d:'HACKERAI console build.',c:'ai'},
{n:'WITCH',u:'witch/',d:'WITCH AI. Free-first, open-source powered.',c:'ai'},
{n:'PRESIDENT',u:'president/',d:'PRESIDENTIAL AI — command of a nation. Political sim.',c:'games'},
{n:'FORGE',u:'forge/',d:'FORGE — Roblox Studio replica in the browser.',c:'games'},
{n:'FLIPSIDE',u:'flipside/',d:'FLIPSIDE — flip smarter. Coin-flip decisions.',c:'games'},
{n:'TITAN 1',u:'titan1/',d:'TITAN-100 command center.',c:'infra'},
{n:'VOCABLIFT',u:'vocablift/',d:'VocabLift — say it plain, leave it polished.',c:'tools'}
];
var MAXS={hell:398,jarvis:8,friday:7,deepagent:51,fleet:4,tiktok:3};
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function url(s){return s.u.indexOf('http')===0?s.u:BASE+s.u}
var ICOL={ai:'#00e5ff',tools:'#ff2d55',games:'#ffb02e',infra:'#a78bfa'};
function card(s,feat){
var d=document.createElement('div');d.className='card'+(feat?' feat':'');
var ini=esc(((s.n||'?').replace(/[^A-Za-z0-9]/g,'').charAt(0)||'?').toUpperCase());
d.innerHTML='<div class="crow"><div class="ictile" style="background:'+(ICOL[s.c]||'#00e5ff')+'">'+ini+'</div><div><div class="chip">'+(feat?'current build':s.c)+'</div><div class="name">'+esc(s.n)+'</div></div>'+(LC[s.n]?'<span class="bdg">\u00d7'+LC[s.n]+'</span>':'')+'</div><div class="desc">'+esc(s.d)+'</div><div class="row"><a class="btn open" href="'+url(s)+'" target="_blank" rel="noopener">OPEN ↗</a><button class="btn embed" data-n="'+esc(s.n)+'" data-u="'+url(s)+'">EMBED ▣</button></div>';
d.querySelector('.embed').addEventListener('click',function(){openOv(s.n,url(s))});
d.querySelector('.open').addEventListener('click',function(){logLaunch(s.n)});
return d;
}
var LC={};try{LC=JSON.parse(localStorage.getItem('illv3launches')||'{}')}catch(e){}
var FEED=[];try{FEED=JSON.parse(localStorage.getItem('illv3feed')||'[]')}catch(e){}
function logLaunch(n){LC[n]=(LC[n]||0)+1;FEED.unshift({n:n,t:Date.now()});FEED=FEED.slice(0,6);try{localStorage.setItem('illv3launches',JSON.stringify(LC));localStorage.setItem('illv3feed',JSON.stringify(FEED))}catch(e){}renderDeck();render(document.getElementById('q').value)}
function renderDeck(){var d=document.getElementById('deckgrid'),f=document.getElementById('feedbox');if(!d)return;var top=Object.keys(LC).sort(function(a,b){return LC[b]-LC[a]}).slice(0,3);d.innerHTML=top.length?top.map(function(n,i){return '<div class="lcard"><span class="rank">#'+(i+1)+'</span><span class="nm">'+esc(n)+'</span><span class="ct">\u00d7'+LC[n]+'</span></div>'}).join(''):'<div class="lcard"><span class="nm" style="color:var(--dim)">no launches yet — open something, it counts here</span></div>';f.innerHTML=FEED.length?FEED.map(function(e){var m=Math.floor((Date.now()-e.t)/60000);var ago=m<1?'just now':(m<60?m+' min ago':Math.floor(m/60)+'h '+(m%60)+'m ago');return '<div><b>'+esc(e.n)+'</b> \u00b7 '+ago+'</div>'}).join(''):'<div>no activity yet</div>'}
var CAT='all';
function setCat(c){CAT=c;document.querySelectorAll('.fchip[data-c]').forEach(function(b){b.classList.toggle('on',b.dataset.c===c)});render(document.getElementById('q').value)}
document.querySelectorAll('.fchip[data-c]').forEach(function(b){b.addEventListener('click',function(){setCat(b.dataset.c)})});
document.getElementById('rand').addEventListener('click',function(){var s=SITES[Math.floor(Math.random()*SITES.length)];openOv(s.n,url(s))});
document.addEventListener('keydown',function(e){var q=document.getElementById('q');if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
function render(q){
q=(q||'').toLowerCase();
var f=document.getElementById('feat'),r=document.getElementById('rest');f.innerHTML='';r.innerHTML='';
var shown=0;
SITES.forEach(function(s){if(CAT!=='all'&&s.c!==CAT)return;if(q&&!(s.n+' '+s.d).toLowerCase().includes(q))return;shown++;(CAT==='all'&&!q&&s.f?f:r).appendChild(card(s,CAT==='all'&&!q&&s.f))});
if(!shown){f.innerHTML='<div class="desc" style="color:var(--dim)">nothing matches that — the vault runs deep, try a shorter word</div>'}
document.getElementById('stats').innerHTML='<div class="stat"><b>398</b> hell builds live</div><div class="stat"><b>51</b> deepagents</div><div class="stat"><b>8</b> jarvis · <b>7</b> friday</div><div class="stat"><b>'+SITES.length+'</b> sites linked</div>';
document.getElementById('featsec').style.display=(CAT==='all'&&!q&&f.children.length)?'':'none';
}
function openOv(n,u){logLaunch(n);document.getElementById('ovname').textContent=n+' — '+u;document.getElementById('ovpop').href=u;document.getElementById('ovframe').src=u;document.getElementById('ov').classList.add('on')}
document.getElementById('q').addEventListener('input',function(e){render(e.target.value)});
document.getElementById('ovclose').addEventListener('click',function(){document.getElementById('ov').classList.remove('on');document.getElementById('ovframe').src='about:blank'});
document.getElementById('a_max').textContent='latest: '+MAXS.hell+' hell · '+MAXS.jarvis+' jarvis · '+MAXS.friday+' friday · '+MAXS.deepagent+' deepagent · '+MAXS.fleet+' fleet · '+MAXS.tiktok+' tiktok';
document.getElementById('a_go').addEventListener('click',function(){var s=document.getElementById('a_series').value,n=Math.max(1,Math.min(MAXS[s],parseInt(document.getElementById('a_num').value||'1',10)));window.open(BASE+s+n+'/','_blank','noopener')});
render('');
renderDeck();
</script>
</body>
</html>
