<!DOCTYPE html>

<meta charset="UTF-8">

<title>KODEX — roblox coding AI</title>
<link rel="stylesheet" href="../kodex3/styles.css?v=3">

</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">⌘</span> KODEX <span class="sub">roblox dev ai</span></div>
    <div class="topactions">
      <button id="modebtn" class="modebtn" title="Switch mode">ROBLOX</button>
      <span id="modeltag" class="tag">openai-fast</span>
      <button id="clearbtn" class="ghostbtn" title="Clear chat">clear</button>
    </div>
  </header>
  <main id="chat"></main>
  <div id="cooldown" class="hidden"><span id="cdmsg"></span></div>
  <footer id="composer">
    <textarea id="input" rows="1" placeholder="ask anything roblox or code related..."></textarea>
    <button id="send" title="Send">➤</button>
  </footer>
</div>
