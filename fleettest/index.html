<!DOCTYPE html><html><head><meta charset="utf-8"><title>py test</title></head>
<body><pre id="o">booting pyodide...</pre>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(async()=>{
  const o=document.getElementById("o");
  const py=await loadPyodide({indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"});
  o.textContent="pyodide ready\n";
  try{
    const r1=await py.runPythonAsync("import urllib.request\nprint(urllib.request.urlopen('https://example.com').status)");
    o.textContent+="urlopen: "+r1+"\n";
  }catch(e){o.textContent+="urlopen FAILED: "+String(e).slice(0,300)+"\n";}
  try{
    const r2=await py.runPythonAsync("from pyodide.http import pyfetch\nr=await pyfetch('https://example.com')\nprint(r.status)");
    o.textContent+="pyfetch: "+r2+"\n";
  }catch(e){o.textContent+="pyfetch FAILED: "+String(e).slice(0,300)+"\n";}
})();
</script></body></html>
