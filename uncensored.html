<!DOCTYPE html>
<!-- v17 platform -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uncensored AI</title>
<style>
  :root{--bg:#212121;--panel:#171717;--soft:#2f2f2f;--line:#ffffff24;--txt:#ececec;--dim:#b4b4b4;--faint:#8f8f8f;--link:#7ab7ff}
  body[data-theme="light"]{--bg:#f5f5f7;--panel:#ffffff;--soft:#e8e8ee;--line:#0000001f;--txt:#1a1a1a;--dim:#555;--faint:#888;--link:#0a66d0}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh}
  .top{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
  .ic{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--txt);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .model{width:auto;height:auto;font-size:15px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:4px;margin-left:2px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .model span{font-size:11px;color:var(--dim)}
  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .wrap{max-width:768px;margin:0 auto;padding:16px 16px 4px}
  .hello{padding:10vh 24px 0;text-align:center}
  .hello h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:22px auto 0}
  .card{background:transparent;border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;color:var(--txt);font-size:14px;cursor:pointer}
  .card b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
  .card small{color:var(--dim);font-size:12.5px}
  .m{margin:18px 0}
  .u{display:flex;justify-content:flex-end}
  .u .bub{background:var(--soft);color:var(--txt);border-radius:22px;border-bottom-right-radius:6px;padding:10px 16px;max-width:78%;white-space:pre-wrap;word-break:break-word}
  .a{color:var(--txt);white-space:pre-wrap;word-break:break-word;line-height:1.7}
  .a code{font-family:ui-monospace,Menlo,monospace;background:#111;outline:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:14.5px}
  body[data-theme="light"] .a code{background:#eee}
  .a a{color:var(--link)}
  .a img.aiimg{max-width:100%;border-radius:12px;margin:8px 0;display:block}
  .file{display:flex;justify-content:flex-end;margin:0 0 6px}
  .file span{background:var(--soft);border-radius:14px;padding:7px 12px;font-size:12.5px;color:var(--dim)}
  .actions{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
  .actions button{background:var(--soft);border:0;color:var(--dim);border-radius:10px;padding:4px 10px;font-size:12px;cursor:pointer}
  .check{font-size:13.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
  table.dt{border-collapse:collapse;font-size:12.5px;margin:6px 0;max-width:100%;display:block;overflow-x:auto}
  .dt td,.dt th{border:1px solid var(--line);padding:3px 8px;text-align:left}
  .status{max-width:768px;margin:0 auto;padding:2px 16px;font-size:12.5px;color:var(--faint);text-align:center;min-height:18px}
  .dock{flex:0 0 auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 10px)}
  #chipsbar{max-width:768px;margin:0 auto 4px;display:none;flex-wrap:wrap;gap:6px;padding:0 4px}
  .chip2{background:var(--soft);color:var(--dim);border-radius:12px;padding:4px 10px;font-size:12.5px;display:flex;gap:6px;align-items:center}
  .chip2 button{background:none;border:0;color:var(--faint);font-size:13px}
  .pill{max-width:768px;margin:0 auto;background:var(--soft);border-radius:26px;padding:8px 10px 8px 14px;display:flex;align-items:flex-end;gap:6px;box-shadow:0 2px 10px #0004}
  .pill textarea{flex:1;background:transparent;border:0;outline:none;color:var(--txt);font:16px/1.4 inherit;resize:none;max-height:120px;padding:9px 0}
  .pill textarea::placeholder{color:var(--faint)}
  .icb{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--txt);font-size:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #send{background:#fff;color:#212121;width:34px;height:34px;font-size:16px;margin-left:2px}
  #send:disabled{background:#4d4d4d;color:#8f8f8f}
  #micBtn.rec{color:#ff5a5a}
  .fine{max-width:768px;margin:7px auto 0;font-size:11px;color:var(--faint);text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
  .chips .chip{display:none}
  .drawer{position:fixed;inset:0 auto 0 0;width:80%;max-width:330px;background:var(--panel);z-index:30;transform:translateX(-102%);transition:transform .22s ease;padding:calc(env(safe-area-inset-top) + 14px) 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .drawer.open{transform:none}
  .shade{position:fixed;inset:0;background:#000a;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
  .shade.on{opacity:1;pointer-events:auto}
  .newchat{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--txt);font-size:15px;padding:10px 10px;border-radius:10px;cursor:pointer;text-align:left;width:100%}
  .newchat:hover{background:#ffffff12}
  body[data-theme="light"] .newchat:hover{background:#00000008}
  .dtitle{font-size:12px;color:var(--faint);padding:8px 10px 2px}
  .dbody{font-size:13px;color:var(--dim);padding:0 10px;line-height:1.55}
  .chatitem{display:flex;align-items:center;gap:6px}
  .chatitem .newchat{flex:1}
  .chatitem button.del{background:none;border:0;color:var(--faint);font-size:15px;padding:8px}
  .panel{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px 12px}
  .panel .prow{display:flex;gap:8px;align-items:center}
  .panel h3{font-size:16px;font-weight:600;flex:1}
  .ptitle{font-weight:600;font-size:16px;flex:1}
  .tin{width:100%;background:var(--soft);border:0;outline:none;color:var(--txt);border-radius:12px;padding:10px 12px;font:15px/1.4 inherit;resize:none}
  .plist{flex:1;overflow-y:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
  .pitem{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .pitem .pi-em{font-size:20px;flex:0 0 auto}
  .pitem .pi-tx{flex:1;min-width:0}
  .pitem .pi-tx b{display:block;font-size:14.5px}
  .pitem .pi-tx small{color:var(--dim);font-size:12px;display:block;white-space:pre-wrap;word-break:break-word;max-height:60px;overflow:hidden}
  .pitem button{background:none;border:0;color:var(--dim);font-size:15px;padding:6px;flex:0 0 auto;cursor:pointer}
  .pitem.on{outline:1.5px solid var(--link)}
  .sbtn{background:var(--soft);border:0;color:var(--txt);border-radius:12px;padding:11px 12px;font-size:14px;flex:1;cursor:pointer}
  .mini{font-size:12px;color:var(--faint);line-height:1.5}
  .togglerow{display:flex;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:14.5px}
  .togglerow input{width:44px;height:26px;accent-color:var(--link)}
  .filetabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
  .ftab{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center;border:0;color:var(--txt);cursor:pointer;flex:0 0 auto}
  .ftab.on{outline:1.5px solid var(--link)}
  .ftab button{background:none;border:0;color:var(--faint);font-size:12px;padding:0}
  #wsEditor{flex:1;width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);outline:none;border-radius:12px;padding:10px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:none;white-space:pre;overflow:auto}
  #siteFrame{flex:1;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;min-height:140px}
  #wsConsole{background:var(--panel);border:1px solid var(--line);border-radius:10px;font:11.5px/1.5 ui-monospace,Menlo,monospace;color:var(--dim);padding:6px 10px;max-height:70px;overflow-y:auto;white-space:pre-wrap;display:none}
  .taskrow{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px}
  .taskrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--link)}
  .taskrow .tt{flex:1;min-width:0;word-break:break-word}
  .taskrow.done .tt{color:var(--faint);text-decoration:line-through}
  .taskrow button{background:none;border:0;color:var(--faint);font-size:14px}
</style>
</head>
