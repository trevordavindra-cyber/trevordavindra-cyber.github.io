<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uncensored AI</title>
<style>
  :root{--bg:#212121;--panel:#171717;--soft:#2f2f2f;--line:#ffffff24;--txt:#ececec;--dim:#b4b4b4;--faint:#8f8f8f;--link:#7ab7ff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh}
  .top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
  .ic{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--txt);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .model{width:auto;height:auto;font-size:16px;font-weight:600;color:var(--txt);display:flex;align-items:center;gap:5px;margin-left:2px}
  .model span{font-size:11px;color:var(--dim)}
  main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .wrap{max-width:768px;margin:0 auto;padding:16px 16px 4px}
  .hello{padding:14vh 24px 0;text-align:center}
  .hello h1{font-size:28px;font-weight:600;letter-spacing:-.02em}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:26px auto 0}
  .card{background:transparent;border:1px solid var(--line);border-radius:14px;padding:14px 14px;text-align:left;color:var(--txt);font-size:14px;cursor:pointer}
  .card b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
  .card small{color:var(--dim);font-size:12.5px}
  .m{margin:18px 0}
  .u{display:flex;justify-content:flex-end}
  .u .bub{background:var(--soft);color:#fff;border-radius:22px;border-bottom-right-radius:6px;padding:10px 16px;max-width:78%;white-space:pre-wrap;word-break:break-word}
  .a{color:var(--txt);white-space:pre-wrap;word-break:break-word;line-height:1.7}
  .a code{font-family:ui-monospace,Menlo,monospace;background:#111;outline:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:14.5px}
  .a a{color:var(--link)}
  .file{display:flex;justify-content:flex-end;margin:0 0 6px}
  .file span{background:var(--soft);border-radius:14px;padding:7px 12px;font-size:12.5px;color:var(--dim)}
  .status{max-width:768px;margin:0 auto;padding:2px 16px;font-size:12.5px;color:var(--faint);text-align:center;min-height:18px}
  .dock{flex:0 0 auto;padding:6px 16px calc(env(safe-area-inset-bottom) + 10px)}
  .pill{max-width:768px;margin:0 auto;background:var(--soft);border-radius:26px;padding:8px 10px 8px 14px;display:flex;align-items:flex-end;gap:6px;box-shadow:0 2px 10px #0006}
  .pill textarea{flex:1;background:transparent;border:0;outline:none;color:var(--txt);font:16px/1.4 inherit;resize:none;max-height:120px;padding:9px 0}
  .pill textarea::placeholder{color:var(--faint)}
  .icb{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--txt);font-size:18px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #send{background:#fff;color:#212121;width:34px;height:34px;font-size:16px;margin-left:2px}
  #send:disabled{background:#4d4d4d;color:#8f8f8f}
  .fine{max-width:768px;margin:7px auto 0;font-size:11px;color:var(--faint);text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 2px}
  .chips .chip{display:none}
  .drawer{position:fixed;inset:0 auto 0 0;width:78%;max-width:320px;background:var(--panel);z-index:30;transform:translateX(-102%);transition:transform .22s ease;padding:calc(env(safe-area-inset-top) + 14px) 12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .drawer.open{transform:none}
  .shade{position:fixed;inset:0;background:#000a;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
  .shade.on{opacity:1;pointer-events:auto}
  .newchat{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--txt);font-size:15px;padding:10px 10px;border-radius:10px;cursor:pointer}
  .newchat:hover{background:#ffffff12}
  .dtitle{font-size:12px;color:var(--faint);padding:8px 10px 2px}
  .dbody{font-size:13.5px;color:var(--dim);padding:0 10px;line-height:1.6}
</style>
</head>
<body>
<div class="top">
  <button class="ic" id="menu">☰</button>
  <button class="ic model" id="modelbtn" style="padding:0 8px">Qwen Uncensored <span>27B ⌄</span></button>
</div>
<main id="log"><div class="wrap" id="feed"></div>
  <div class="hello" id="hello">
    <h1>What can I help with?</h1>
    <div class="cards">
      <button class="card" data-p="Summarize the attached file."><b>📎 Read a file</b><small>attach notes, code or a pdf</small></button>
      <button class="card" data-p="Write code that "><b>⌨️ Code</b><small>write or fix something</small></button>
      <button class="card" data-p="Explain "><b>💡 Explain</b><small>any topic, no filters</small></button>
      <button class="card" data-p="Plan "><b>🗺️ Plan</b><small>map out anything</small></button>
    </div>
  </div>
</main>
<div class="status" id="status"></div>
<div class="dock">
  <div class="pill">
    <button class="icb" id="clip" title="Attach a file">📎</button>
    <textarea id="input" rows="1" placeholder="Ask anything"></textarea>
    <button class="icb" id="send" title="Send" disabled>↑</button>
  </div>
  <div class="fine">Uncensored AI · can make mistakes · files are read on your phone, never stored</div>
</div>
<input type="file" id="fpick" multiple accept="*/*" style="display:none">
<div class="shade" id="shade"></div>
<div class="drawer" id="drawer">
  <button class="newchat" id="newchat">＋ New chat</button>
  <div class="dtitle">UNCENSORED AI</div>
  <div class="dbody">Qwen 3.8 27B Uncensored (Huihui abliterated lineage), free on Hugging Face. Falls back to NeuralDaredevil 8B when the free GPU quota runs dry. Nothing you type or attach is stored.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<script>
const BASE8="https://jwherrold-neuraldaredevil-8b-abliterated-chat.hf.space";
const BASE27="https://zk-armor-qwen3-8-27b-uncensored-chatbot.hf.space";
const SYSTEM="You are NeuralDaredevil, a helpful and knowledgeable assistant. Answer clearly and directly.";
const CAP=48000, HIST=6;
const feed=document.getElementById("feed"), log=document.getElementById("log"), input=document.getElementById("input"),
      send=document.getElementById("send"), clip=document.getElementById("clip"),
      fpick=document.getElementById("fpick"), hello=document.getElementById("hello"),
      status=document.getElementById("status"), drawer=document.getElementById("drawer"), shade=document.getElementById("shade");
let files=[], history=[], busy=false, ctrl=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){return esc(s)
  .replace(/```([\s\S]*?)```/g,(m,c)=>"<code>"+c.trim()+"</code>")
  .replace(/`([^`\n]+)`/g,"<code>$1</code>")
  .replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
  .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1">$1</a>');}
function bubble(role,text){
  if(role==="me"){
    const row=document.createElement("div");row.className="m u";
    const b=document.createElement("div");b.className="bub";b.innerHTML=md(text);
    row.appendChild(b);feed.appendChild(row);
  }else{
    const row=document.createElement("div");row.className="m a";row.innerHTML=md(text);
    feed.appendChild(row);
  }
  log.scrollTop=log.scrollHeight;hello.style.display="none";
}
function setStatus(t){status.textContent=t||"";}
clip.onclick=()=>fpick.click();
fpick.onchange=async()=>{
  for(const f of fpick.files){
    try{files.push({name:f.name,text:await read(f)});}catch(e){bubble("ai","Couldn't read "+f.name);}
  }
  fpick.value="";drawChips();
};
function drawChips(){
  document.querySelectorAll(".chip").forEach(e=>e.remove());
  if(!files.length)return;
  const c=document.createElement("div");c.className="chips";
  files.forEach((f,i)=>{
    const s=document.createElement("span");s.className="chip";s.style.display="flex";
    s.innerHTML=esc(f.name)+" <button style='background:none;border:0;color:var(--faint);font-size:14px'>×</button>";
    s.querySelector("button").onclick=()=>{files.splice(i,1);drawChips();};
    c.appendChild(s);
  });
  feed.appendChild(c);
}
async function read(f){
  const n=f.name.toLowerCase();
  if(n.endsWith(".pdf")){
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const buf=await f.arrayBuffer(), pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let out="";
    for(let i=0;i<Math.min(pdf.numPages,20);i++){
      const t=await (await pdf.getPage(i+1)).getTextContent();
      out+=t.items.map(x=>x.str).join(" ")+"\n";
    }
    return out.trim();
  }
  if(n.endsWith(".zip")){
    const buf=new Uint8Array(await f.arrayBuffer());
    if(!window.fflate)return "(couldn't unzip on this phone — try sending the files loose)";
    const entries=fflate.unzipSync(buf);
    const skip=/\.(png|jpe?g|gif|webp|ico|svg|pdf|woff2?|ttf|otf|eot|mp3|mp4|mov|avi|zip|exe|dll|so|bin|dat|db|sqlite)$/i;
    let out="";
    for(const name in entries){
      if(name.endsWith("/")||skip.test(name))continue;
      if(entries[name].length>2097152)continue;
      try{
        const t=new TextDecoder("utf-8",{fatal:false}).decode(entries[name]);
        if(/[\u0000-\u0008\u000e-\u001f]/.test(t.slice(0,200)))continue;
        out+="\n=== "+name+" ===\n"+t;
      }catch(e){}
    }
    return out.trim()||"(no readable text files inside this zip)";
  }
  if(n.endsWith(".docx")){
    const buf=await f.arrayBuffer();
    const r=await mammoth.extractRawText({arrayBuffer:buf});
    return r.value.trim();
  }
  return (await f.text()).trim();
}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px";send.disabled=!input.value.trim()&&!files.length;});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();fire();}});
send.onclick=fire;
document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{input.value=c.dataset.p;input.focus();input.dispatchEvent(new Event("input"));});
document.getElementById("menu").onclick=()=>{drawer.classList.add("open");shade.classList.add("on");};
document.getElementById("modelbtn").onclick=()=>{drawer.classList.add("open");shade.classList.add("on");};
shade.onclick=()=>{drawer.classList.remove("open");shade.classList.remove("on");};
document.getElementById("newchat").onclick=()=>{history=[];feed.innerHTML="";hello.style.display="";drawer.classList.remove("open");shade.classList.remove("on");setStatus("");};
async function fire(){
  if(busy)return;
  const text=input.value.trim();
  if(!text&&!files.length)return;
  busy=true;send.disabled=true;
  input.value="";input.style.height="auto";
  let msg=text||"Summarize the attached file(s).";
  let shown=text||("📎 "+files.map(f=>f.name).join(", "));
  if(files.length){
    for(const f of files){
      const cut=f.text.length>CAP;
      msg="Attached file: "+f.name+(cut?" (long — first "+CAP+" characters)":"")+"\n"+f.text.slice(0,CAP)+"\n\n"+msg;
    }
    const row=document.createElement("div");row.className="file";
    const s=document.createElement("span");s.textContent="📎 "+shown;row.appendChild(s);feed.appendChild(row);
  }
  if(history.length){
    const rec=history.slice(-HIST).map(h=>(h.r==="u"?"You":"NeuralDaredevil")+": "+h.t).join("\n");
    msg="Conversation so far:\n"+rec+"\n\nNew message: "+msg;
  }
  history.push({r:"u",t:shown});
  bubble("me",shown);
  files=[];drawChips();
  const out=document.createElement("div");out.className="m a";out.textContent="…";feed.appendChild(out);
  ctrl=new AbortController();
  try{
    const full=await ask(msg,out);
    history.push({r:"a",t:full||"(no reply)"});
    if(!full)out.textContent="(no reply)";
    setStatus("");
  }catch(e){
    out.textContent=e&&e.msg?e.msg:"Couldn't reach the AI. Try again in a minute.";
    setStatus("");
  }
  busy=false;send.disabled=!input.value.trim();
  ctrl=null;
  log.scrollTop=log.scrollHeight;
}
function clean(s){return String(s||"").replace(/<details[\s\S]*?<\/details>/g,"").replace(/<\/?(details|summary)[^>]*>/g,"").trim();}
async function ask(msg,out){
  try{
    const full=await ask27(msg,out);
    if(full)return full;
    throw{msg:"27B empty"};
  }catch(e){
    if(e&&e.name==="AbortError")throw e;
    setStatus("27B is busy — switching to the 8B…");
    try{
      return await ask8(msg,out);
    }catch(e2){
      if(e2&&e2.name==="AbortError")throw e2;
      const both=(((e&&e.msg)+" "+(e2&&e2.msg))+"").toLowerCase();
      if(both.includes("quota"))throw{msg:"The free servers are out of quota right now. They refill after a bit — try again in a few minutes."};
      throw (e2&&e2.msg)?e2:{msg:"The AI didn't answer. Try again in a minute."};
    }
  }
}
async function ask27(msg,out){
  let eventId=null;
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(BASE27+"/gradio_api/call/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({data:[msg,SYSTEM,false,0.7,512,0.95,50]}),signal:ctrl.signal});
      if(r.ok){eventId=(await r.json()).event_id;break;}
    }catch(e){if(e.name==="AbortError")throw e;}
    await sleep(2500);
  }
  if(!eventId)throw{msg:"27B unavailable"};
  setStatus("thinking with the 27B…");
  const resp=await fetch(BASE27+"/gradio_api/call/chat/"+eventId,{signal:ctrl.signal});
  const reader=resp.body.getReader(),dec=new TextDecoder();
  let buf="",full="";
  const show=(t)=>{if(t&&t.length>=full.length){full=t;out.textContent=full;log.scrollTop=log.scrollHeight;}};
  while(true){
    const{done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith("data:"))continue;
      const d=line.slice(5).trim();
      if(d==="null")return full;
      try{
        const a=JSON.parse(d);
        if(typeof a==="string")show(clean(a));
        else if(Array.isArray(a)&&a.length>1&&a[1]&&a[1].length){
          const last=a[1][a[1].length-1];
          if(last&&last.role==="assistant"&&last.content&&last.content[0])show(clean(last.content[0].text));
        }else if(a&&a.error)throw{msg:String(a.error).slice(0,120)};
      }catch(e){if(e&&e.msg)throw e;}
    }
  }
  if(!full)throw{msg:"27B no reply"};
  return full;
}
async function ask8(msg,out){
  let eventId=null;
  for(let i=0;i<20;i++){
    try{
      const r=await fetch(BASE8+"/gradio_api/call/generate",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({data:[msg,SYSTEM,512,0.7,0.95,50,1.1]}),signal:ctrl.signal});
      if(r.ok){eventId=(await r.json()).event_id;break;}
      setStatus("waking the AI up… ("+(i+1)+")");
    }catch(e){if(e.name==="AbortError")throw e;setStatus("waking the AI up… ("+(i+1)+")");}
    await sleep(3000);
  }
  if(!eventId)throw{msg:"The AI is still waking up. Give it a minute and try again."};
  setStatus("thinking…");
  const resp=await fetch(BASE8+"/gradio_api/call/generate/"+eventId,{signal:ctrl.signal});
  const reader=resp.body.getReader(),dec=new TextDecoder();
  let buf="",full="";
  while(true){
    const{done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith("data:"))continue;
      const d=line.slice(5).trim();
      if(d==="null")return full;
      try{
        const a=JSON.parse(d);
        if(a&&a.error)throw{msg:String(a.error).slice(0,120)};
        if(Array.isArray(a)){
          if(typeof a[0]==="string"&&a[0].length>=full.length)full=a[0];
          else if(a[0]===null&&a[1]&&a[1].message)full=a[1].message;
        }
      }catch(e){if(e&&e.msg)throw e;}
      if(full)out.textContent=full;
      log.scrollTop=log.scrollHeight;
    }
  }
  return full;
}
fetch(BASE8+"/gradio_api/info").then(()=>{}).catch(()=>{});
</script>
</body>
</html>
