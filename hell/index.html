<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HELL</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--ash:#c9c2bd;--dim:#8a837e;--ember:#ff4d2e;--blood:#a11414;--coals:#2a0a06;--edge:#3a120c;--panel:#120705}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--ash);font-family:Georgia,'Times New Roman',serif;height:100dvh;display:flex;flex-direction:column}
#top{padding:14px;text-align:center;border-bottom:1px solid var(--edge);background:radial-gradient(ellipse at 50% -60%,#3d0d02 0%,#000 75%)}
#top h1{font-size:30px;color:var(--ember);letter-spacing:.22em;text-shadow:0 0 22px rgba(255,77,46,.5);line-height:1}
#strip{display:flex;gap:14px;justify-content:center;padding:5px;font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;background:var(--panel);border-bottom:1px solid var(--edge)}
#strip .on{color:var(--ember)}
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px}
.line{max-width:90%;line-height:1.55;font-size:16px;white-space:pre-wrap;word-wrap:break-word}
.line.you{align-self:flex-end;color:var(--ash);border-right:2px solid var(--ember);padding-right:10px;font-style:italic}
.line.imp{align-self:flex-start;color:#e8ded6;border-left:2px solid var(--blood);padding-left:10px}
.line.omen{align-self:center;color:var(--dim);font-size:12px;letter-spacing:1px;font-style:italic;text-align:center;max-width:90%}
#foot{border-top:1px solid var(--edge);background:var(--panel);padding:10px;display:flex;gap:8px;align-items:flex-end}
#txt{flex:1;background:#050201;border:1px solid var(--edge);color:var(--ash);font-family:inherit;font-size:16px;padding:11px 12px;border-radius:2px;min-height:46px;resize:none}
#txt:focus{outline:none;border-color:var(--ember)}
button.act{background:linear-gradient(#5c1108,#a11414);color:#ffd9cf;border:0;font-family:inherit;letter-spacing:2px;font-size:14px;padding:12px 18px;cursor:pointer;border-radius:2px}
button.act:disabled{opacity:.4}
#clear{background:none;border:0;color:var(--dim);font-size:12px;padding:12px 8px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<div id="top"><h1>HELL</h1></div>
<div id="strip"><span id="st-net">LINK: —</span><span>BRAIN: CLOUDFORGE</span><span id="st-state">STATE: IDLE</span></div>

<div id="chat">
  <div class="omen">the gate is open. no downloads, nothing to summon — ask and it answers.<br>it runs on a free hosted mind, so this site needs signal.</div>
</div>

<div id="foot">
  <textarea id="txt" rows="1" placeholder="speak to it…"></textarea>
  <button class="act" id="send">SEND</button>
  <button class="act" id="stop" style="display:none">SEVER</button>
  <button id="clear">cleanse</button>
</div>

<script type="module">
const chat=document.getElementById('chat'), txt=document.getElementById('txt'),
      sendB=document.getElementById('send'), stopB=document.getElementById('stop'),
      clearB=document.getElementById('clear'), stNet=document.getElementById('st-net'),
      stState=document.getElementById('st-state');

let hist=[], abort=false, busy=false;

function line(cls,text){const d=document.createElement('div');d.className='line '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;}
function setStrip(){stNet.textContent='LINK: '+(navigator.onLine?'OPEN':'SEVERED');stNet.className=navigator.onLine?'on':'';}
addEventListener('online',setStrip);addEventListener('offline',setStrip);setStrip();

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

const CORE='You are HELL, a direct and capable AI assistant. Answer clearly and completely.';

async function askCloud(user){
  const messages=[{role:'system',content:CORE}];
  for(const m of hist) messages.push(m);
  messages.push({role:'user',content:user});
  try{
    const res=await fetch('https://text.pollinations.ai/openai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'openai',messages,private:true})
    });
    if(!res.ok) throw new Error('cloud answered '+res.status);
    const data=await res.json();
    const out=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'';
    if(out) return out;
    throw new Error('empty reply');
  }catch(e){
    // fallback: plain GET
    let p=CORE+'\n';
    for(const m of hist) p+=(m.role==='user'?'User: ':'HELL: ')+m.text+'\n';
    p+='User: '+user+'\nHELL:';
    const res2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(p));
    if(!res2.ok) throw e;
    const t=await res2.text();
    if(!t) throw e;
    return t;
  }
}

async function speak(){
 const user=txt.value.trim(); if(!user||busy) return;
 txt.value=''; line('you',user);
 const out=line('imp','');
 const wait=line('omen','the forge is thinking…');
 sendB.disabled=true; stopB.style.display=''; busy=true; abort=false;
 stState.textContent='STATE: SPEAKING';
 try{
   const answer=await askCloud(user);
   wait.remove();
   out.textContent=answer||'(silence)';
   hist.push({role:'user',content:user},{role:'assistant',content:answer||''});
   if(hist.length>12) hist=hist.slice(-12);
 }catch(e){
   wait.remove();
   out.textContent='';
   line('omen','the voice broke: '+String(e).slice(0,160)+' — check your signal and try again');
 }
 stState.textContent='STATE: IDLE';
 sendB.disabled=false; stopB.style.display='none'; busy=false;
 chat.scrollTop=chat.scrollHeight;
}

stopB.onclick=()=>{abort=true;};
sendB.onclick=speak;
clearB.onclick=()=>{hist=[];chat.innerHTML='';line('omen','the slate is clean. ask again.');};
txt.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();speak();} });
</script>
</body>
</html>
