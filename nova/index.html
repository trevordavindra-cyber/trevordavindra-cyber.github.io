<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<meta name="description" content="NOVA: a free AI chat that actually helps. No keys, no signup, unlimited chats.">
<title>NOVA — the AI that actually helps</title>
<link rel="preconnect" href="https://text.pollinations.ai">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">N</span>
    <div class="brandtext">
      <span class="name">NOVA</span>
      <span class="sub" id="statusLine">connecting…</span>
    </div>
  </div>
  <div class="topactions">
    <button id="clearBtn" class="pill ghost" title="Clear chat">clear</button>
    <button id="newBtn" class="pill solid" title="New chat">new chat</button>
  </div>
</header>

<main id="chat" class="chat">
  <div id="welcome" class="welcome">
    <h1>what are we making today?</h1>
    <p class="lede">Free, unlimited, no signup. Nova is set up to genuinely push to help instead of hedging — ask it anything.</p>
    <div class="chips" id="chips">
      <button class="chip" data-q="Plan my week: give me a realistic schedule for school, work and side projects, then ask me 3 questions to sharpen it.">plan my week</button>
      <button class="chip" data-q="I have an idea. Help me pressure-test it: the strongest objections, who it fails for, and what I should test first. Be blunt.">pressure-test an idea</button>
      <button class="chip" data-q="Write something viral for social media about my project — hook first, then the body. Give me 3 options.">write a post</button>
      <button class="chip" data-q="Teach me one useful thing in 60 seconds, the kind of thing that compounds. Pick it yourself.">teach me something</button>
      <button class="chip" data-q="Help me debug/decide/build whatever I'm stuck on. Start by asking me what I'm working on.">unstick me</button>
      <button class="chip" data-q="Roast my plan so far, then rebuild it better. Be honest, not mean.">roast my plan</button>
    </div>
  </div>
  <div id="messages" class="messages"></div>
</main>

<footer class="composer">
  <div class="modebar" id="modebar">
    <button class="mode active" data-mode="default">nova</button>
    <button class="mode" data-mode="coder">code mode</button>
    <button class="mode" data-mode="creative">creative mode</button>
  </div>
  <form id="askForm" class="inputrow">
    <textarea id="input" rows="1" placeholder="ask nova anything…" autocomplete="off"></textarea>
    <button id="sendBtn" class="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="fine">free · no key · powered by open models</p>
</footer>

<div id="toast" class="toast" role="status"></div>

<script src="prompt.js"></script>
<script src="app.js"></script>
</body>
</html>
