<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatGPT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2300A67D'/%3E%3Ctext x='16' y='21' font-size='14' fill='white' text-anchor='middle'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../deepagent29/styles.css?v=2">
<link rel="manifest" href="../deepagent9/manifest.webmanifest">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');</script>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="brand"><span id="brandname">ChatGPT</span><span id="brandchev">▾</span></div>
    <button id="newchat">+ New chat</button>
    <div id="chatslabel"><span id="chatsglyph">☰</span> Chats</div>
    <input id="chatsearch" placeholder="Search chats" autocomplete="off">
    <div id="dchats"></div>
    <div class="sideitem" id="u25lib"><span>≡</span> Prompt library</div>
    <div class="sideitem" id="copychat"><span>⧉</span> Copy chat</div>
    <div class="sideitem" id="starreditem"><span>☆</span> Starred</div>
    <div class="sideitem" id="dlchat"><span>⬇</span> Download chat</div>
    <div class="sideitem" id="backup"><span>⭳</span> Backup all chats</div>
    <div class="sideitem" id="restore"><span>⭱</span> Restore backup</div>
    <div class="sideitem" id="kbd"><span>⌨</span> Keyboard shortcuts</div>
    <div class="sideitem" id="themeset"><span id="themeicon">◐</span> <span id="themetxt">Light</span></div>
    <div id="sidefoot">
      <div id="userrow"><span id="useravatar"></span><span id="username">ChatGPT</span><span id="userchev">⌄</span></div>
    </div>
  </aside>
  <main id="main">
    <div id="topbar">
      <div id="topbrand">ChatGPT <span id="topchev">▾</span></div>
      <div id="topactions">
        <button class="topbtn" id="search" title="Search">🔍</button>
        <button class="topbtn" id="speakall" title="Read aloud">🔊</button>
        <button class="topbtn" id="tempchat" title="Temporary chat">👻</button>
        <button class="topbtn" id="textsize" title="Text size">Aa</button>
        <button class="topbtn" id="profilebtn" title="Profile">👤</button>
      </div>
    </div>
    <div id="stream"></div>
    <div id="composer">
      <textarea id="inp" placeholder="Ask anything" rows="1"></textarea>
      <div id="crow">
        <button id="attachbtn">＋</button>
        <button id="thinkbtn">💡 Think</button>
        <button id="searchbtn">🔎 Search</button>
        <button id="micbtn" title="Dictate">🎙</button>
        <button id="sendbtn">➤</button>
      </div>
      <div id="counter"></div>
    </div>
  </main>
</div>
<input type="file" id="file" style="display:none">
<div id="toast"></div>
<div id="upd" title="build version"><span class="lbl">build</span> <span class="val">2.9.20(32)</span></div>
<script src="../deepagent29/app.js?v=8"></script>
<script src="../deepagent29/up.js?v=1"></script>

<script src="../deepagent29/up8.js?v=1"></script>
<script src="../deepagent30/up9.js?v=1"></script>
<script src="../deepagent31/up10.js?v=1"></script>
<script src="../deepagent32/up11.js?v=1"></script>
<script src="../deepagent33/up12.js?v=1"></script>
<script src="../deepagent34/up13.js?v=2"></script>

<script src="../deepagent45/up24.js?v=1"></script>
<script src="../deepagent46/up25.js?v=1"></script>
<script src="up26.js?v=2"></script>
</body>
</html>
