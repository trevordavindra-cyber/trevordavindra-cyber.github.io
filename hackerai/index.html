<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HACKERAI</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>💀</text></svg>">
<style>
:root{--g:#00ff66;--dim:#0a3f1e;--bg:#000;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--g);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,255,102,.035) 0 1px,transparent 1px 3px);mix-blend-mode:screen;z-index:40}
#mx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s}
#mx.on{opacity:.22}
#boot{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:0 8vw;transition:opacity .6s}
#boot p{font-size:12px;line-height:1.9;color:var(--g);opacity:.85;white-space:pre-wrap}
#boot .cursor{display:inline-block;width:9px;height:14px;background:var(--g);animation:bl .9s steps(1) infinite;vertical-align:-2px}
@keyframes bl{50%{opacity:0}}
#app{display:none;height:100%;flex-direction:column;position:relative;z-index:1}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--dim);font-size:11px;letter-spacing:.2em;color:#fff;background:linear-gradient(#020c05,#000)}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
header .r{margin-left:auto;color:var(--g);opacity:.6}
#log{flex:1;overflow-y:auto;padding:14px 14px 6px;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.msg{max-width:760px;margin:0 auto 14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.msg .who{display:block;font-size:10px;letter-spacing:.25em;opacity:.55;margin-bottom:4px}
.msg.you{color:#e8ffe8}
.msg.ai{color:var(--g);text-shadow:0 0 8px rgba(0,255,102,.25)}
.msg.sys{color:#7ef;max-width:760px;margin:0 auto 14px;font-size:12px}
.msg img{max-width:100%;border:1px solid var(--dim);border-radius:4px;margin-top:6px}
form{display:flex;gap:8px;padding:8px 14px 6px;border-top:1px solid var(--dim);background:#000;align-items:flex-end}
#in{flex:1;background:#01130a;border:1px solid var(--dim);color:#eaffea;font:inherit;font-size:14px;padding:12px 12px;outline:none;resize:none;max-height:120px;border-radius:4px}
#in:focus{border-color:var(--g);box-shadow:0 0 12px rgba(0,255,102,.15)}
button{background:var(--g);color:#001a08;border:0;font:inherit;font-weight:700;letter-spacing:.12em;padding:12px 16px;border-radius:4px;cursor:pointer}
button:active{transform:translateY(1px)}
.tbar{display:flex;gap:6px;padding:0 14px 8px;background:#000;flex-wrap:wrap}
.tbar button{background:#01130a;color:var(--g);border:1px solid var(--dim);font-size:10px;letter-spacing:.15em;padding:7px 10px}
.tbar button.on{background:var(--g);color:#001a08}
#foot{text-align:center;font-size:9px;letter-spacing:.3em;color:var(--dim);padding-bottom:8px}
#pending{max-width:760px;margin:0 auto 4px;font-size:11px;color:#ffd97a;display:none}
#panel{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
#panel[hidden]{display:none}
.pbox{width:100%;max-width:680px;max-height:86vh;border:1px solid var(--dim);background:#010a05;border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.ptabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--dim);flex-wrap:wrap}
.ptabs button{background:#01130a;color:var(--g);border:1px solid var(--dim);font-size:10px;padding:6px 10px}
.ptabs button.on{background:var(--g);color:#001a08}
.pbody{padding:12px;font-size:12px;line-height:1.7;overflow-y:auto;white-space:pre-wrap;color:#bfe}
.pbody input{width:100%;background:#01130a;border:1px solid var(--dim);color:#eaffea;font:inherit;padding:8px;margin-bottom:8px;border-radius:4px}
.pbody .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pbody .row button{background:#01130a;color:var(--g);border:1px solid var(--dim);font-size:10px;padding:7px 10px}
.pbody pre{white-space:pre-wrap;word-break:break-all;color:var(--g);border:1px dashed var(--dim);padding:8px;border-radius:4px}
#pclose{margin-left:auto}
</style>
</head>
<body>
<canvas id="mx"></canvas>
<div id="boot">
<p id="blines"></p>
</div>
<div id="app">
<header><span class="dot"></span>HACKERAI<span class="r" id="hstat">NODE 01 // ONE AI ONLY</span></header>
<div id="log"></div>
<div id="pending"></div>
<div class="tbar">
<button type="button" id="bfile">+ FILE</button>
<button type="button" id="bmic">MIC</button>
<button type="button" id="btalk">TALK</button>
<button type="button" id="bmodel">MODEL: OPENAI</button>
<button type="button" id="btools">/TOOLS</button>
<button type="button" id="bhelp">/HELP</button>
</div>
<form id="f" autocomplete="off">
<textarea id="in" rows="1" placeholder="ask anything_"></textarea>
<button type="submit">SEND</button>
<input type="file" id="file" accept=".txt,.md,.json,.csv,.js,.html,.css,.py,.log,.xml" style="display:none">
</form>
<div id="foot">HACKERAI v1.3 // SINGLE AI // FREE RELAY // NOTHING STORED OFF THIS BROWSER</div>
</div>
<div id="panel" hidden>
<div class="pbox">
<div class="ptabs">
<button data-t="box" class="on">TOOLBOX</button>
<button data-t="ports">PORTS</button>
<button data-t="linux">LINUX</button>
<button data-t="learn">LEARN</button>
<button id="pclose">CLOSE ✕</button>
</div>
<div class="pbody" id="pbody"></div>
</div>
</div>
<script>
const BASE='You are HACKERAI, the single AI on a hacker-style terminal site. Personality: sharp, calm, a little ominous, never cheesy. You answer anything: coding, tech, security concepts explained for learning, and everyday questions. Keep replies short and dense, use plain text, no markdown headers. You are one assistant, not a persona or a crew. If asked to do something illegal or harmful, refuse in one line and offer the safe version.';
const HELP=['COMMANDS:','/help - this list','/clear - wipe the chat','/memory - what the AI remembers about you','/forget - wipe memory','/model name - switch free model (openai, mistral, llama)','/read URL QUESTION - the AI reads a live web page and answers','/search QUERY - live web search, answers with sources','/image DESCRIPTION - makes an image from text','/cve CVE-ID - live CVE vulnerability lookup (e.g. /cve CVE-2021-44228)','/ip IP-OR-DOMAIN - location, ISP and network info','/dns DOMAIN [TYPE] - dns records (A, MX, TXT) via google dns','/jwt TOKEN - decode a json web token (no signature check)','/rot13 TEXT - rot13 cipher decoder','/uuid - random uuid v4','/hash TEXT - sha-256 hash, entropy and strength','/passgen LENGTH - strong random password','/audit DESCRIPTION - defensive security checklist for your system','/tools - offline toolbox: encode/decode, rot13, ports, linux, learn','/matrix - toggle the rain background','/export - download the chat as a text file','+ FILE button - attach a text file for the AI to read','MIC - voice input. TALK - spoken replies','remember THING - store a fact about you forever'].join('\n');
const PORTS=['COMMON PORTS:','20 FTP data, 21 FTP, 22 SSH, 23 Telnet (legacy), 25 SMTP','53 DNS, 67/68 DHCP, 80 HTTP, 110 POP3, 143 IMAP','443 HTTPS, 445 SMB, 587 SMTP submit','3306 MySQL, 3389 RDP, 5432 PostgreSQL','6379 Redis, 8080 HTTP alt, 9200 Elasticsearch','25565 Minecraft'].join('\n');
const CHEAT=['LINUX BASICS:','ls -la list files | cd dir go | pwd where am i','cat file read | nano file edit | mkdir make dir','cp a b copy | mv a b move/rename | rm -rf dir delete (careful)','ps aux processes | top live | kill -9 PID stop','df -h disk | free -h ram | du -sh dir size','chmod +x file make executable | chown user file','grep -ri word dir search text | find / -name x find files','ssh user@host connect | scp a user@host:/b copy over ssh','curl URL fetch | wget URL download','systemctl status app service | journalctl -u app logs','netstat -tulpn open ports | ss -tulpn same, newer','whoami, uname -a, history, man cmd'].join('\n');
const CONCEPTS=['CONCEPTS (LEARN THE DEFENSE):','XSS - attacker injects javascript into a page others view. defense: escape output, csp headers.','SQL INJECTION - input changes a database query. defense: parameterized queries, least-privilege db user.','CSRF - a site tricks your browser into sending a request as you. defense: csrf tokens, same-site cookies.','IDOR - guessing ids in urls reads other people data. defense: check ownership server-side every time.','RCE - running attacker code on a server. defense: patch fast, sandbox, never eval user input.','PRIVESC - going from low user to root. defense: patches, sudo rules, no world-writable configs.','PHISHING - fake pages steal logins. defense: 2fa, check domains, password managers flag fakes.','ZERO DAY - a flaw with no patch yet. defense: layered controls, monitoring, backups.'].join('\n');
const log=document.getElementById('log'),ta=document.getElementById('in'),pend=document.getElementById('pending');
let hist=[],mem=[],model=localStorage.getItem('hk_model')||'openai',pendingFile=null,talkOn=false,rec=null,mxd=false;
try{hist=JSON.parse(localStorage.getItem('hk_hist')||'[]')}catch(e){hist=[]}
try{mem=JSON.parse(localStorage.getItem('hk_mem')||'[]')}catch(e){mem=[]}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function add(role,text){const m=document.createElement('div');m.className='msg '+role;if(role==='sys'){m.innerHTML=esc(text)}else if(role==='img'){m.innerHTML='<span class="who">HACKERAI</span>'+esc(text[0]);const i=document.createElement('img');i.src=text[1];i.alt=esc(text[0]);i.loading='lazy';m.appendChild(i)}else{m.innerHTML='<span class="who">'+(role==='you'?'YOU':'HACKERAI')+'</span>'+esc(text)}log.appendChild(m);log.scrollTop=log.scrollHeight;return m}
function boot(lines,el,cb){let i=0;(function n(){if(i>=lines.length){el.insertAdjacentHTML('beforeend','<span class="cursor"></span>');setTimeout(cb,600);return}el.textContent+=lines[i++]+"\n";setTimeout(n,230)})()}
const BLINES=['> initializing node...','> mounting /brain ... ok','> scanning relays ... 1 found','> loading tools: search, read, files, image, cve, recon, dns, memory, voice','> security: local session only','> one AI loaded. no extras.',''];
boot(BLINES,document.getElementById('blines'),()=>{document.getElementById('boot').style.opacity=0;setTimeout(()=>{document.getElementById('boot').style.display='none';document.getElementById('app').style.display='flex';},600)});
if(hist.length){add('sys','-- session restored ('+hist.filter(h=>h.role==='user').length+' messages) --')}
function setModel(n){model=(n||'openai').toLowerCase();document.getElementById('bmodel').textContent='MODEL: '+model.toUpperCase();localStorage.setItem('hk_model',model);document.getElementById('hstat').textContent='NODE 01 // '+model.toUpperCase()}
document.getElementById('bmodel').addEventListener('click',()=>{const ms=['openai','mistral','llama'];setModel(ms[(ms.indexOf(model)+1)%ms.length]);add('sys','model switched to '+model)});
setModel(model);
function sysmsg(t){add('sys',t)}
document.getElementById('bhelp').addEventListener('click',()=>sysmsg(HELP));
document.getElementById('bfile').addEventListener('click',()=>document.getElementById('file').click());
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>300000){sysmsg('file too big, keep it under 300kb');return}const r=new FileReader();r.onload=()=>{pendingFile={name:f.name,text:String(r.result).slice(0,60000)};pend.style.display='block';pend.textContent='[ attached: '+f.name+' - will be read with your next message ]'};r.readAsText(f);e.target.value=''});
function speak(t){if(!talkOn)return;try{const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' code block ').slice(0,600));speechSynthesis.speak(u)}catch(e){}}
document.getElementById('btalk').addEventListener('click',function(){talkOn=!talkOn;this.classList.toggle('on',talkOn);sysmsg(talkOn?'talk mode on: replies are spoken':'talk mode off')});
document.getElementById('bmic').addEventListener('click',function(){try{if(!rec){const R=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new R();rec.lang='en-US';rec.onresult=e=>{ta.value=e.results[0][0].transcript;document.getElementById('f').requestSubmit()}}rec.start();this.classList.add('on');sysmsg('listening...')}catch(e){sysmsg('voice input not supported on this browser')}});
async function relay(q,extra){
const m=add('ai','');m.classList.add('think');m.textContent='thinking...';
try{
const body={model:model,messages:[{role:'system',content:BASE+(mem.length?'\nFacts you remember about the user:\n- '+mem.join('\n- '):'')}].concat(hist.slice(-16)).concat(extra||[]).concat([{role:'user',content:q}])};
const res=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
let out='';
if(res.ok){const j=await res.json();out=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||''}
if(!out){const r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));if(r2.ok){out=await r2.text()}}
if(!out)out='[relay down. try again.]';
m.classList.remove('think');m.innerHTML='<span class="who">HACKERAI</span>';
let i=0;const t=out;(function type(){m.innerHTML='<span class="who">HACKERAI</span>'+esc(t.slice(0,i));log.scrollTop=log.scrollHeight;if(i<t.length){i+=3;setTimeout(type,10)}else{m.innerHTML='<span class="who">HACKERAI</span>'+esc(t)}})();
speak(out);
return out;
}catch(e){m.classList.remove('think');m.innerHTML='<span class="who">HACKERAI</span>[connection failed. check the relay and retry.]';return ''}
}
async function readPage(url,q){
const m=add('ai','');m.classList.add('think');m.textContent='reading the page...';
try{
const r=await fetch('https://r.jina.ai/'+url);
if(!r.ok)throw 0;
const t=(await r.text()).slice(0,12000);
m.remove();
const out=await relay((q||'Summarize the key points of this page in a few bullets, plain text.')+'\n\nWEB PAGE CONTENT FROM '+url+':\n'+t,[{role:'user',content:'(the page content above was fetched live from '+url+')'}]);
hist.push({role:'assistant',content:out});save();
}catch(e){m.classList.remove('think');m.innerHTML='<span class="who">HACKERAI</span>[could not read that page. check the url.]'}
}
async function searchWeb(q){
const m=add('ai','');m.classList.add('think');m.textContent='searching the live web...';
try{
const r=await fetch('https://r.jina.ai/https://html.duckduckgo.com/html/?q='+encodeURIComponent(q));
if(!r.ok)throw 0;
const t=(await r.text()).slice(0,8000);
m.remove();
add('sys','[ web search: '+q+' ]');
const out=await relay('Live web search results for "'+q+'":\n'+t+'\n\nAnswer the question: '+q+'\nName the sites your answer came from in plain text.',[{role:'user',content:'(live search results above)'}]);
hist.push({role:'assistant',content:out});save();
}catch(e){m.classList.remove('think');m.innerHTML='<span class="who">HACKERAI</span>[search failed, the relay may be busy. try again.]'}
}
async function cveLookup(id){
const m=add('ai','');m.classList.add('think');m.textContent='querying the cve database...';
try{
const r=await fetch('https://cve.circl.lu/api/cve/'+encodeURIComponent(id.toUpperCase()));
if(!r.ok)throw 0;
const j=await r.json();
const md=j.cveMetadata||{};const cna=(j.containers&&j.containers.cna)||{};
const cid=md.cveId||j.id||id.toUpperCase();
const pub=(md.datePublished||'').slice(0,10)||'?';
const desc=((cna.descriptions||[]).find(d=>d&&d.value)||{}).value||'no summary on file';
let sev='?';
for(const mt of (cna.metrics||[])){const k=Object.keys(mt)[0];const v=mt[k];
 if(v&&typeof v==='object'){if(typeof v.baseScore==='number'){sev=v.baseScore+(v.baseSeverity?' '+v.baseSeverity:'');break}
 const c=v.content||{};if(c&&c.other){sev=String(c.other);break}}}
const aff=((cna.affected||[])[0]||{});const prod=[aff.vendor,aff.product].filter(Boolean).join(' ');
m.remove();
add('sys','[ CVE DATABASE ]\n'+cid+' | severity '+(sev==='?'?'unrated':sev)+' | published '+pub+(prod?'\nproduct: '+prod:'')+'\n\n'+String(desc).slice(0,700));
}catch(e){m.classList.remove('think');m.innerHTML='<span class="who">HACKERAI</span>[cve lookup failed or id not found. try /search instead]'}
}
async function ipInfo(t){
const m=add('ai','');m.classList.add('think');m.textContent='resolving...';
try{
const r=await fetch('https://ipwho.is/'+encodeURIComponent(t));
const j=await r.json();
if(!j.success)throw 0;
m.remove();
const c=j.connection||{};
add('sys','[ RECON: '+j.ip+' ]\n'+(j.country||'?')+(j.region?', '+j.region:'')+(j.city?', '+j.city:'')+'\nisp: '+(c.isp||'?')+'\norg: '+(c.org||'?')+'\nasn: '+(c.asn||'?')+'\ntimezone: '+((j.timezone&&j.timezone.id)||'?'));
}catch(e){m.classList.remove('think');m.innerHTML='<span class="who">HACKERAI</span>[lookup failed, check the address]'}
}
async function dnsLookup(rest){
const m=add('ai','');m.classList.add('think');m.textContent='resolving...';
try{
const sp=rest.indexOf(' ');const name=sp<0?rest.trim():rest.slice(0,sp).trim();const type=(sp<0?'A':rest.slice(sp+1).trim().toUpperCase())||'A';
const r=await fetch('https://dns.google/resolve?name='+encodeURIComponent(name)+'&type='+encodeURIComponent(type));
const j=await r.json();
if(!j.Answer||!j.Answer.length)throw 0;
m.remove();
add('sys','[ DNS '+name+' '+type+' ]\n'+j.Answer.map(a=>a.data+(a.TTL?' (ttl '+a.TTL+')':'')).join('\n'));
}catch(e){m.classList.remove('think');m.innerHTML='<span class="who">HACKERAI</span>[no records found or lookup failed]'}
}
function sha256(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''))}
function entropy(s){let set=0;if(/[a-z]/.test(s))set+=26;if(/[A-Z]/.test(s))set+=26;if(/[0-9]/.test(s))set+=10;if(/[^a-zA-Z0-9]/.test(s))set+=33;return s.length?Math.round(s.length*Math.log2(set||2)):0}
async function hashTool(t){
const h=await sha256(t);const e=entropy(t);
const verdict=e<40?'weak':e<60?'fair':e<80?'strong':'very strong';
add('sys','[ HASH LAB ]\nsha-256: '+h+'\nentropy: ~'+e+' bits ('+verdict+')');
}
function passGen(n){
n=Math.min(Math.max(parseInt(n)||20,8),64);
const chars='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*()-_=+';
const a=new Uint32Array(n);crypto.getRandomValues(a);
const out=Array.from(a,x=>chars[x%chars.length]).join('');
add('sys','[ PASSGEN '+n+' ]\n'+out+'\nentropy ~'+entropy(out)+' bits. stored nowhere, copy it now.');
}
const cv=document.getElementById('mx');const ctx=cv.getContext('2d');let drops=[],mxTimer=null;
function mxSize(){cv.width=innerWidth;cv.height=innerHeight;drops=Array(Math.floor(cv.width/14)).fill(1)}
addEventListener('resize',mxSize);mxSize();
const KATA='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﬀ0123456789';
function mxLoop(){
ctx.fillStyle='rgba(0,8,3,.08)';ctx.fillRect(0,0,cv.width,cv.height);
ctx.fillStyle='#00ff66';ctx.font='14px monospace';
for(let i=0;i<drops.length;i++){const ch=KATA[Math.floor(Math.random()*KATA.length)];ctx.fillText(ch,i*14,drops[i]*14);if(drops[i]*14>cv.height&&Math.random()>.975)drops[i]=0;drops[i]++}
mxTimer=setTimeout(mxLoop,50);
}
function matrixToggle(){mxd=!mxd;cv.classList.toggle('on',mxd);if(mxd)mxLoop();else{clearTimeout(mxTimer);ctx.clearRect(0,0,cv.width,cv.height)}sysmsg(mxd?'matrix rain on':'matrix rain off')}
function toolsOpen(){panel.hidden=false;tabShow('box')}
const panel=document.getElementById('panel'),pbody=document.getElementById('pbody');
panel.addEventListener('click',e=>{if(e.target===panel)panel.hidden=true});
document.getElementById('pclose').addEventListener('click',()=>panel.hidden=true);
function tabShow(t){
document.querySelectorAll('.ptabs button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
if(t==='box'){pbody.innerHTML='<input id="bx" placeholder="text to encode or decode..."><div class="row"><button id="e64">BASE64 ENCODE</button><button id="d64">BASE64 DECODE</button><button id="ehex">HEX ENCODE</button><button id="dhex">HEX DECODE</button><button id="eurl">URL ENCODE</button><button id="durl">URL DECODE</button><button id="r13">ROT13</button></div><pre id="bxo">output...</pre>';
const go=f=>()=>{try{pbody.querySelector('#bxo').textContent=f(pbody.querySelector('#bx').value)}catch(e){pbody.querySelector('#bxo').textContent='[not valid for that]'}};
pbody.querySelector('#e64').onclick=go(s=>btoa(unescape(encodeURIComponent(s))));
pbody.querySelector('#d64').onclick=go(s=>decodeURIComponent(escape(atob(s.trim()))));
pbody.querySelector('#ehex').onclick=go(s=>Array.from(new TextEncoder().encode(s)).map(x=>x.toString(16).padStart(2,'0')).join(' '));
pbody.querySelector('#dhex').onclick=go(s=>new TextDecoder().decode(new Uint8Array(s.trim().split(/[\s,]+/).map(x=>parseInt(x,16)))));
pbody.querySelector('#eurl').onclick=go(encodeURIComponent);
pbody.querySelector('#durl').onclick=go(decodeURIComponent);
pbody.querySelector('#r13').onclick=go(s=>s.replace(/[a-zA-Z]/g,c=>String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26)));
}else{pbody.textContent={ports:PORTS,linux:CHEAT,learn:CONCEPTS}[t]||''}}
document.querySelectorAll('.ptabs button[data-t]').forEach(b=>b.addEventListener('click',()=>tabShow(b.dataset.t)));
document.getElementById('btools').addEventListener('click',toolsOpen);
function save(){try{localStorage.setItem('hk_hist',JSON.stringify(hist.slice(-40)));localStorage.setItem('hk_mem',JSON.stringify(mem))}catch(e){}}
document.getElementById('f').addEventListener('submit',async e=>{
e.preventDefault();const q=ta.value.trim();if(!q)return;ta.value='';ta.style.height='auto';
const lower=q.toLowerCase();
if(lower.startsWith('/')){const parts=q.slice(1).split(' ');const cmd=parts[0].toLowerCase();const rest=parts.slice(1).join(' ');
if(cmd==='help'){sysmsg(HELP)}
else if(cmd==='clear'){hist=[];save();log.innerHTML='';sysmsg('-- chat wiped --')}
else if(cmd==='memory'){sysmsg(mem.length?'REMEMBERED:\n- '+mem.join('\n- '):'memory is empty. say "remember thing" to store a fact.')}
else if(cmd==='forget'){mem=[];save();sysmsg('-- memory wiped --')}
else if(cmd==='model'){if(rest){setModel(rest.split(' ')[0]);sysmsg('model switched to '+model)}else sysmsg('usage: /model openai | mistral | llama')}
else if(cmd==='read'){if(!rest){sysmsg('usage: /read URL QUESTION')}else{const sp=rest.indexOf(' ');const url=sp<0?rest:rest.slice(0,sp);const ask2=sp<0?null:rest.slice(sp+1);if(!/^https?:\/\//.test(url))sysmsg('that does not look like a url');else{hist.push({role:'user',content:'/read '+url});await readPage(url,ask2)}}}
else if(cmd==='search'){if(!rest){sysmsg('usage: /search QUERY')}else{hist.push({role:'user',content:'/search '+rest});await searchWeb(rest)}}
else if(cmd==='image'){if(!rest){sysmsg('usage: /image DESCRIPTION')}else{add('img',['image: '+rest,'https://image.pollinations.ai/prompt/'+encodeURIComponent(rest)+'?width=768&height=768&nologo=true'])}}
else if(cmd==='cve'){if(!rest){sysmsg('usage: /cve CVE-2021-44228 (for keywords use /search)')}else if(/^cve-\d{4}-\d{4,}$/i.test(rest)){hist.push({role:'user',content:'/cve '+rest});await cveLookup(rest)}else sysmsg('that is not a cve id. format: /cve CVE-2021-44228. for keywords use /search')}
else if(cmd==='ip'){if(!rest){sysmsg('usage: /ip 8.8.8.8 or /ip example.com')}else{hist.push({role:'user',content:'/ip '+rest});await ipInfo(rest.trim())}}
else if(cmd==='dns'){if(!rest){sysmsg('usage: /dns example.com MX (type optional, default A)')}else{hist.push({role:'user',content:'/dns '+rest});await dnsLookup(rest)}}
else if(cmd==='jwt'){if(!rest){sysmsg('usage: /jwt your.token.here (decoded locally, signature is not checked)')}else{const p=rest.trim().split('.');if(p.length<2){sysmsg('that is not a jwt, it needs dots')}else{try{const d=s=>JSON.stringify(JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))))),null,1);sysmsg('[ JWT DECODED ]\nheader:\n'+d(p[0])+'\n\npayload:\n'+d(p[1])+'\n\nsignature: not verified, never trust an unverified token')}catch(e){sysmsg('could not decode that token')}}}}
else if(cmd==='rot13'){if(!rest){sysmsg('usage: /rot13 some text')}else{add('sys','[ ROT13 ]\n'+rest.replace(/[a-zA-Z]/g,c=>String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26)))}}
else if(cmd==='uuid'){const u=(crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),(x,i)=>('0'+x.toString(16)).slice(-2)+(i%4===3?'-':'')).join(''));add('sys','[ UUID v4 ]\n'+u)}
else if(cmd==='hash'){if(!rest){sysmsg('usage: /hash yourtext')}else await hashTool(rest)}
else if(cmd==='passgen'){passGen(rest)}
else if(cmd==='audit'){if(!rest){sysmsg('usage: /audit describe your system, e.g. a wordpress site on a vps')}else{hist.push({role:'user',content:'/audit '+rest});const out=await relay('DEFENSIVE SECURITY REVIEW REQUEST. The user describes their own system: "'+rest+'". Give a prioritized defensive checklist: the misconfigurations most likely to bite them first, then hardening steps, then monitoring. Educational and constructive only, no attack instructions. Plain text, short lines.');hist.push({role:'assistant',content:out});save()}}
else if(cmd==='tools'){toolsOpen()}
else if(cmd==='matrix'){matrixToggle()}
else if(cmd==='export'){const txt=hist.map(h=>(h.role==='user'?'YOU: ':'HACKERAI: ')+h.content).join('\n\n')+'\n\nREMEMBERED: '+mem.join(' | ');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='hackerai-chat.txt';a.click();sysmsg('-- chat exported --')}
else{sysmsg('unknown command. try /help')}
return}
add('you',q);
if(lower.startsWith('remember ')){const fact=q.slice(9).trim();if(fact){mem.push(fact);save();sysmsg('[ stored: '+fact+' ]')}}
let content=q;
if(pendingFile){content='Attached file "'+pendingFile.name+'":\n'+pendingFile.text+'\n\nMy question or instruction: '+q;add('sys','[ file '+pendingFile.name+' attached ]');pendingFile=null;pend.style.display='none'}
hist.push({role:'user',content:q});
const out=await relay(content);
hist.push({role:'assistant',content:out});save();
});
ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px'});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('f').requestSubmit()}});
</script>
